<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Planner Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-[#FBFBFE] pb-24 text-slate-800" onload="initApp()">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 py-4 px-6 border-b border-slate-100 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-video-camera text-2xl text-blue-600"></i>
            <h1 class="text-lg font-extrabold tracking-tight text-slate-900">Content<span class="text-blue-600">Planner.</span></h1>
        </div>
        <div class="text-xs font-bold bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full flex items-center gap-1">
            <i class="ph-fill ph-user-circle"></i> Kreator
        </div>
    </header>

    <main class="p-4 md:p-8 max-w-3xl mx-auto space-y-6">
        
        <!-- Form Input -->
        <section class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
            <h2 id="formTitle" class="text-sm font-extrabold text-slate-900 uppercase tracking-widest mb-4 flex items-center gap-2">
                <i class="ph-fill ph-plus-circle text-blue-600 text-lg"></i> Tambah Konten
            </h2>
            <form id="taskForm" onsubmit="saveTask(event)" class="space-y-3">
                <input type="hidden" id="editTaskId" value="">
                
                <div class="relative">
                    <i class="ph ph-text-aa absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="taskTitle" required placeholder="Judul Konten (Contoh: POV Anak Agency)" autocomplete="off" class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold focus:ring-2 focus:ring-blue-500/20 outline-none transition-all">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <i class="ph ph-briefcase absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="taskClient" required placeholder="Dari Siapa / Klien" autocomplete="off" class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold focus:ring-2 focus:ring-blue-500/20 outline-none transition-all">
                    </div>
                    <div class="relative">
                        <i class="ph ph-calendar-blank absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="date" id="taskDate" required class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold text-slate-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition-all">
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 px-6 rounded-2xl transition items-center justify-center">Batal</button>
                    <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition flex justify-center items-center gap-2">
                        <i class="ph-fill ph-paper-plane-right"></i> SIMPAN TUGAS
                    </button>
                </div>
            </form>
        </section>

        <!-- Active Tasks Board -->
        <section>
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2 ml-2">
                <i class="ph-fill ph-list-dashes text-lg text-blue-500"></i> Antrean Konten
            </h2>
            <div id="activeBoard" class="space-y-4">
                <!-- Cards will be injected here -->
                <div class="text-center text-xs text-slate-400 py-8"><i class="ph ph-spinner animate-spin text-2xl mb-2"></i><br>Memuat data...</div>
            </div>
        </section>

        <!-- Completed Tasks Board -->
        <section class="pt-6">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2 ml-2">
                <i class="ph-fill ph-check-circle text-lg text-green-500"></i> Sudah Selesai
            </h2>
            <div id="completedBoard" class="space-y-3">
                <!-- Completed cards -->
            </div>
        </section>

    </main>

    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyDoX3MZ0hxtL2j3ol3N_1w8ohYCdXPsUtI",
            authDomain: "appmoluscadesign.firebaseapp.com",
            databaseURL: "https://appmoluscadesign-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "appmoluscadesign",
            storageBucket: "appmoluscadesign.firebasestorage.app",
            messagingSenderId: "800709666958",
            appId: "1:800709666958:web:66f97b271f736e17c981df"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = 'creator_tasks'; // Menggunakan node baru agar tidak bentrok dengan Molusca

        function initApp() {
            // Set default date to today
            document.getElementById('taskDate').valueAsDate = new Date();
            loadData();
        }

        // --- Core Logic ---
        async function saveTask(e) {
            e.preventDefault();
            const editId = document.getElementById('editTaskId').value;
            const taskId = editId ? editId : Date.now().toString();
            
            const taskData = {
                id: taskId,
                title: document.getElementById('taskTitle').value,
                client: document.getElementById('taskClient').value,
                targetDate: document.getElementById('taskDate').value,
                isCompleted: editId ? undefined : false, // Biarkan status jika sedang edit
                createdAt: editId ? undefined : new Date().toISOString()
            };

            if (editId) {
                // Update
                await db.ref(`${dbRef}/${taskId}`).update({
                    title: taskData.title,
                    client: taskData.client,
                    targetDate: taskData.targetDate
                });
                cancelEdit();
            } else {
                // Create
                await db.ref(`${dbRef}/${taskId}`).set(taskData);
                document.getElementById('taskForm').reset();
                document.getElementById('taskDate').valueAsDate = new Date();
            }
        }

        function loadData() {
            db.ref(dbRef).on('value', (snapshot) => {
                const data = snapshot.val();
                const tasks = data ? Object.values(data) : [];
                renderBoard(tasks);
            });
        }

        function toggleComplete(id, currentStatus) {
            db.ref(`${dbRef}/${id}`).update({ isCompleted: !currentStatus });
        }

        function deleteTask(id) {
            if(confirm("Hapus konten ini dari list?")) {
                db.ref(`${dbRef}/${id}`).remove();
            }
        }

        function editTask(id, title, client, targetDate) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('editTaskId').value = id;
            document.getElementById('taskTitle').value = title;
            document.getElementById('taskClient').value = client;
            document.getElementById('taskDate').value = targetDate;
            
            document.getElementById('formTitle').innerHTML = `<i class="ph-fill ph-pencil-simple text-orange-500 text-lg"></i> Edit Konten`;
            document.getElementById('submitBtn').innerHTML = `<i class="ph-fill ph-floppy-disk"></i> UPDATE TUGAS`;
            document.getElementById('submitBtn').className = "flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-orange-200 transition flex justify-center items-center gap-2";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('cancelEditBtn').classList.add('flex');
        }

        function cancelEdit() {
            document.getElementById('editTaskId').value = "";
            document.getElementById('taskForm').reset();
            document.getElementById('taskDate').valueAsDate = new Date();
            
            document.getElementById('formTitle').innerHTML = `<i class="ph-fill ph-plus-circle text-blue-600 text-lg"></i> Tambah Konten`;
            document.getElementById('submitBtn').innerHTML = `<i class="ph-fill ph-paper-plane-right"></i> SIMPAN TUGAS`;
            document.getElementById('submitBtn').className = "flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition flex justify-center items-center gap-2";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('cancelEditBtn').classList.remove('flex');
        }

        // --- Helper: Calculate Date Difference ---
        function getDeadlineInfo(dateStr) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const target = new Date(dateStr);
            target.setHours(0,0,0,0);
            
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            // Format tanggal lokal
            const formattedDate = target.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            if (diffDays < 0) return { text: `Lewat (${formattedDate})`, bg: 'bg-red-50 text-red-600 border-red-200', icon: 'ph-warning-circle' };
            if (diffDays === 0) return { text: 'Take Hari Ini!', bg: 'bg-red-500 text-white shadow-md shadow-red-200 border-red-500 animate-pulse', icon: 'ph-fire' };
            if (diffDays === 1) return { text: 'Besok', bg: 'bg-orange-100 text-orange-600 border-orange-200', icon: 'ph-clock-countdown' };
            if (diffDays <= 3) return { text: `H-${diffDays}`, bg: 'bg-yellow-50 text-yellow-600 border-yellow-200', icon: 'ph-clock-countdown' };
            
            return { text: formattedDate, bg: 'bg-slate-100 text-slate-500 border-slate-100', icon: 'ph-calendar-blank' };
        }

        // --- Render UI ---
        function renderBoard(tasks) {
            const activeBoard = document.getElementById('activeBoard');
            const completedBoard = document.getElementById('completedBoard');
            
            activeBoard.innerHTML = '';
            completedBoard.innerHTML = '';

            // Sort active tasks by closest date
            const activeTasks = tasks.filter(t => !t.isCompleted).sort((a, b) => new Date(a.targetDate) - new Date(b.targetDate));
            const completedTasks = tasks.filter(t => t.isCompleted).reverse();

            if(activeTasks.length === 0) activeBoard.innerHTML = `<div class="text-center text-xs text-slate-400 py-6 border-2 border-dashed border-slate-200 rounded-3xl">Belum ada jadwal konten.</div>`;
            if(completedTasks.length === 0) completedBoard.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">Belum ada konten yang selesai.</div>`;

            // Render Active
            activeTasks.forEach(task => {
                const deadline = getDeadlineInfo(task.targetDate);
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-[24px] border border-slate-100 shadow-sm relative transition-all hover:shadow-md";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex flex-wrap gap-2">
                            <span class="text-[10px] font-black uppercase tracking-tighter px-2.5 py-1 rounded-lg border flex items-center gap-1 ${deadline.bg}">
                                <i class="ph-fill ${deadline.icon}"></i> ${deadline.text}
                            </span>
                            <span class="text-[10px] font-bold text-slate-500 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-100 uppercase tracking-widest flex items-center gap-1">
                                <i class="ph-fill ph-user-circle"></i> ${task.client}
                            </span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="editTask('${task.id}', '${task.title}', '${task.client}', '${task.targetDate}')" class="w-8 h-8 flex items-center justify-center rounded-full bg-orange-50 text-orange-500 hover:bg-orange-500 hover:text-white transition" title="Edit">
                                <i class="ph-fill ph-pencil-simple"></i>
                            </button>
                            <button onclick="deleteTask('${task.id}')" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition" title="Hapus">
                                <i class="ph-fill ph-trash"></i>
                            </button>
                        </div>
                    </div>
                    <h3 class="font-extrabold text-slate-900 text-base leading-tight mb-4 pr-4">${task.title}</h3>
                    
                    <button onclick="toggleComplete('${task.id}', false)" class="w-full bg-slate-50 hover:bg-green-500 hover:text-white text-slate-500 text-[11px] font-extrabold p-3 rounded-xl uppercase tracking-widest flex justify-center items-center gap-2 transition-colors border border-slate-100">
                        <i class="ph-fill ph-check-circle text-lg"></i> Tandai Selesai Di-take
                    </button>
                `;
                activeBoard.appendChild(card);
            });

            // Render Completed
            completedTasks.forEach(task => {
                const card = document.createElement('div');
                card.className = "bg-white/60 p-4 rounded-2xl border border-slate-100 opacity-70 flex justify-between items-center gap-4 transition hover:opacity-100";
                
                card.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-500 text-sm truncate line-through mb-1">${task.title}</h4>
                        <div class="text-[10px] font-bold text-slate-400 uppercase flex gap-2">
                            <span><i class="ph-fill ph-user-circle"></i> ${task.client}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleComplete('${task.id}', true)" class="text-xs font-bold text-slate-400 hover:text-blue-500 transition flex items-center gap-1" title="Kembalikan ke antrean">
                            <i class="ph-bold ph-arrow-u-up-left"></i> Batal Selesai
                        </button>
                        <button onclick="deleteTask('${task.id}')" class="w-8 h-8 flex items-center justify-center rounded-full text-slate-300 hover:text-red-500 transition" title="Hapus Permanen">
                            <i class="ph-fill ph-trash text-lg"></i>
                        </button>
                    </div>
                `;
                completedBoard.appendChild(card);
            });
        }
    </script>
</body>
</html>
