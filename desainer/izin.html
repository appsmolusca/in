<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Izin & Sakit - Molusca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-user-select: none; user-select: none; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .upload-area.dragover { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-[#FBFBFE] pb-24 text-slate-800" onload="initApp()">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 py-4 px-6 border-b border-slate-100 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-first-aid text-2xl text-red-500"></i>
            <h1 class="text-lg font-extrabold tracking-tight text-slate-900">Leave<span class="text-red-500">Tracker.</span></h1>
        </div>
        <button onclick="openEmployeeModal()" class="text-xs font-bold bg-blue-50 hover:bg-blue-100 text-blue-600 px-4 py-2 rounded-xl flex items-center gap-1 transition shadow-sm">
            <i class="ph-fill ph-users-three text-lg"></i> Kelola Tim
        </button>
    </header>

    <main class="p-4 md:p-8 max-w-4xl mx-auto space-y-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Form Izin/Sakit -->
            <section class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm h-fit">
                <h2 class="text-sm font-extrabold text-slate-900 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="ph-fill ph-hand-waving text-red-500 text-lg"></i> Form Pengajuan
                </h2>
                <form id="leaveForm" onsubmit="submitLeave(event)" class="space-y-4">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="relative">
                            <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <select id="employeeName" required class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold outline-none appearance-none focus:ring-2 focus:ring-red-500/20">
                                <option value="" disabled selected>Memuat nama...</option>
                            </select>
                        </div>
                        <div class="relative">
                            <i class="ph ph-tag absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <select id="leaveType" required class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold outline-none appearance-none focus:ring-2 focus:ring-red-500/20">
                                <option value="Sakit">Sakit</option>
                                <option value="Izin">Izin Keperluan</option>
                                <option value="Cuti">Cuti</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="relative">
                            <label class="absolute -top-2 left-4 bg-white px-1 text-[9px] font-black text-slate-400 uppercase tracking-widest rounded">Tanggal Mulai</label>
                            <input type="date" id="startDate" required class="w-full bg-slate-50 border-none rounded-2xl py-4 px-4 text-xs font-bold text-slate-600 focus:ring-2 focus:ring-red-500/20 outline-none">
                        </div>
                        <div class="relative">
                            <label class="absolute -top-2 left-4 bg-white px-1 text-[9px] font-black text-slate-400 uppercase tracking-widest rounded">Sampai Tanggal</label>
                            <input type="date" id="endDate" required class="w-full bg-slate-50 border-none rounded-2xl py-4 px-4 text-xs font-bold text-slate-600 focus:ring-2 focus:ring-red-500/20 outline-none">
                        </div>
                    </div>

                    <div class="relative">
                        <i class="ph ph-text-align-left absolute left-4 top-4 text-slate-400"></i>
                        <textarea id="leaveReason" required placeholder="Alasan lengkap (Misal: Demam tinggi / Acara keluarga)" rows="2" class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold focus:ring-2 focus:ring-red-500/20 outline-none resize-none"></textarea>
                    </div>

                    <div class="relative">
                        <input type="file" id="proofImage" accept="image/*" class="hidden" onchange="previewFile()">
                        <label for="proofImage" id="uploadArea" class="upload-area flex flex-col items-center justify-center w-full bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl py-6 cursor-pointer hover:bg-slate-100 transition-all">
                            <i id="uploadIcon" class="ph ph-image text-3xl text-slate-400 mb-2"></i>
                            <span id="uploadText" class="text-xs font-bold text-slate-500">Upload Bukti Foto</span>
                            <span class="text-[9px] font-bold text-slate-400 mt-1 uppercase tracking-widest">(Opsional / Wajib jika sakit)</span>
                        </label>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-red-200 transition flex justify-center items-center gap-2 mt-2">
                        <i class="ph-fill ph-paper-plane-right"></i> KIRIM PENGAJUAN
                    </button>
                </form>
            </section>

            <!-- Grafik Statistik -->
            <section class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-extrabold text-slate-900 uppercase tracking-widest flex items-center gap-2">
                        <i class="ph-fill ph-chart-bar text-blue-500 text-lg"></i> Statistik Bulan Ini
                    </h2>
                    <select id="chartMonth" onchange="renderChart()" class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-1 text-[10px] font-bold outline-none cursor-pointer">
                        <!-- Bulan akan diisi oleh JS -->
                    </select>
                </div>
                <div class="flex-1 w-full relative min-h-[200px]">
                    <canvas id="statsChart"></canvas>
                </div>
            </section>
        </div>

        <!-- Daftar Pengajuan / History -->
        <section>
            <div class="flex justify-between items-center mb-4 ml-2">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                    <i class="ph-fill ph-clock-counter-clockwise text-lg"></i> Riwayat Pengajuan
                </h2>
                <button onclick="downloadExcel()" class="text-[10px] font-bold bg-green-50 text-green-600 hover:bg-green-500 hover:text-white px-4 py-2 rounded-xl flex items-center gap-1 transition uppercase tracking-widest border border-green-200 shadow-sm">
                    <i class="ph-bold ph-microsoft-excel-logo text-sm"></i> Export Excel (Detail & Rekap)
                </button>
            </div>
            
            <div id="board-history" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full text-center text-xs text-slate-400 py-8"><i class="ph ph-spinner animate-spin text-2xl mb-2"></i><br>Memuat data...</div>
            </div>
        </section>

    </main>

    <!-- Modal Kelola Karyawan -->
    <div id="employeeModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] hidden flex justify-center items-end md:items-center p-4" onclick="closeEmployeeModal(event)">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl transform transition-transform" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-extrabold text-slate-900 uppercase tracking-widest flex items-center gap-2"><i class="ph-fill ph-users-three text-blue-500 text-lg"></i> Kelola Tim Internal</h3>
                <button onclick="closeEmployeeModal()" class="text-slate-400 hover:text-red-500"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <!-- Input Penambahan Nama -->
            <div class="flex gap-2 mb-6">
                <input type="text" id="newEmployeeName" placeholder="Ketik Nama Anggota Baru..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500/20">
                <button onclick="addEmployee()" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-bold text-xs hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex items-center gap-1"><i class="ph-bold ph-plus"></i> Tambah</button>
            </div>

            <div class="space-y-2 max-h-60 overflow-y-auto pr-1" id="employeeList"></div>
        </div>
    </div>

    <!-- Modal Image Preview -->
    <div id="imageModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] hidden flex justify-center items-center p-4" onclick="closeModal()">
        <img id="modalImg" src="" class="max-w-full max-h-[80vh] rounded-2xl shadow-2xl object-contain">
        <button class="absolute top-6 right-6 text-white bg-white/20 p-2 rounded-full hover:bg-white/40"><i class="ph ph-x text-xl"></i></button>
    </div>

    <script>
        // --- KONFIGURASI OTOMATIS CLOUDINARY ---
        let CLOUD_NAME = localStorage.getItem('molusca_cloud_name') || "";
        const CLOUDINARY_UPLOAD_PRESET = "molusca_izin";
        // ---------------------------------------

        const firebaseConfig = {
            apiKey: "AIzaSyDoX3MZ0hxtL2j3ol3N_1w8ohYCdXPsUtI",
            databaseURL: "https://appmoluscadesign-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "appmoluscadesign"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = 'leave_requests';
        const empRef = 'employees';

        let globalRequestsData = [];
        let globalEmployees = [];
        let myChart = null; // Instance Chart.js

        function initApp() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
            
            // Setup dropdown filter bulan untuk grafik
            const monthSelect = document.getElementById('chartMonth');
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const currentMonth = new Date().getMonth();
            months.forEach((m, i) => {
                const isSelected = i === currentMonth ? 'selected' : '';
                monthSelect.innerHTML += `<option value="${i}" ${isSelected}>${m}</option>`;
            });

            loadEmployees();
            loadData();
        }

        function loadEmployees() {
            db.ref(empRef).on('value', (snapshot) => {
                const data = snapshot.val();
                const select = document.getElementById('employeeName');
                const list = document.getElementById('employeeList');
                select.innerHTML = '<option value="" disabled selected>Pilih Nama Anggota</option>';
                list.innerHTML = '';
                globalEmployees = [];

                if(data) {
                    Object.entries(data).forEach(([id, emp]) => {
                        globalEmployees.push(emp.name);
                        select.innerHTML += `<option value="${emp.name}">${emp.name}</option>`;
                        list.innerHTML += `
                            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <span class="text-xs font-bold text-slate-700">${emp.name}</span>
                                <div class="flex gap-2">
                                    <button onclick="editEmployee('${id}', '${emp.name}')" class="text-orange-500 hover:text-orange-600 bg-orange-50 p-1.5 rounded-lg"><i class="ph-fill ph-pencil-simple"></i></button>
                                    <button onclick="deleteEmployee('${id}')" class="text-red-500 hover:text-red-600 bg-red-50 p-1.5 rounded-lg"><i class="ph-fill ph-trash"></i></button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = '<div class="text-center text-xs text-slate-400 py-4">Belum ada data anggota tim.</div>';
                }
                renderChart(); // Update chart setiap kali ada perubahan karyawan
            });
        }

        function addEmployee() {
            const name = document.getElementById('newEmployeeName').value.trim();
            if(name === "") return alert("Nama tidak boleh kosong!");
            db.ref(empRef).push({ name: name });
            document.getElementById('newEmployeeName').value = '';
            alert(name + " berhasil ditambahkan ke tim!");
        }

        function editEmployee(id, oldName) {
            const newName = prompt("Edit Nama Anggota:", oldName);
            if(newName && newName.trim() !== "") db.ref(`${empRef}/${id}`).update({ name: newName.trim() });
        }

        function deleteEmployee(id) {
            if(confirm("Yakin ingin menghapus anggota ini?")) db.ref(`${empRef}/${id}`).remove();
        }

        function openEmployeeModal() { document.getElementById('employeeModal').classList.remove('hidden'); }
        function closeEmployeeModal(e) { if(!e || e.target.id === 'employeeModal' || !e.target) document.getElementById('employeeModal').classList.add('hidden'); }

        function previewFile() {
            const file = document.getElementById('proofImage').files[0];
            const uploadText = document.getElementById('uploadText');
            const uploadIcon = document.getElementById('uploadIcon');
            if (file) {
                uploadText.innerText = "File siap: " + file.name;
                uploadText.className = "text-xs font-bold text-blue-600";
                uploadIcon.className = "ph-fill ph-check-circle text-3xl text-blue-500 mb-2";
            }
        }

        async function submitLeave(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const file = document.getElementById('proofImage').files[0];
            
            if (file && !CLOUD_NAME) {
                CLOUD_NAME = prompt("⚠️ MASUKKAN CLOUD NAME\n\nUntuk mengaktifkan fitur upload foto, masukkan 'Cloud Name' akun Cloudinary:");
                if (!CLOUD_NAME || CLOUD_NAME.trim() === "") {
                    alert("Upload dibatalkan. Sistem butuh Cloud Name untuk menyimpan foto.");
                    CLOUD_NAME = ""; return;
                }
                localStorage.setItem('molusca_cloud_name', CLOUD_NAME.trim());
            }

            const reqData = {
                id: Date.now().toString(),
                name: document.getElementById('employeeName').value,
                type: document.getElementById('leaveType').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                reason: document.getElementById('leaveReason').value,
                timestamp: new Date().toISOString(),
                proofUrl: ""
            };

            btn.disabled = true;

            try {
                if (file) {
                    btn.innerHTML = `<i class="ph ph-spinner animate-spin text-lg"></i> UPLOAD FOTO...`;
                    const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

                    const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
                    const cloudData = await res.json();
                    
                    if(!res.ok) {
                        if (res.status === 404 || res.status === 400 || res.status === 401) {
                            localStorage.removeItem('molusca_cloud_name');
                            CLOUD_NAME = "";
                        }
                        throw new Error(cloudData.error?.message || "Koneksi ke Cloudinary bermasalah");
                    }
                    reqData.proofUrl = cloudData.secure_url;
                }

                btn.innerHTML = `<i class="ph ph-spinner animate-spin text-lg"></i> MENYIMPAN DATA...`;
                await db.ref(`${dbRef}/${reqData.id}`).set(reqData);

                document.getElementById('leaveForm').reset();
                document.getElementById('uploadText').innerText = "Upload Bukti Foto";
                document.getElementById('uploadText').className = "text-xs font-bold text-slate-500";
                document.getElementById('uploadIcon').className = "ph ph-image text-3xl text-slate-400 mb-2";
                
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('startDate').value = today;
                document.getElementById('endDate').value = today;

                alert("Pengajuan berhasil dikirim!");
            } catch (error) {
                console.error(error);
                alert("GAGAL UPLOAD FOTO:\n" + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="ph-fill ph-paper-plane-right"></i> KIRIM PENGAJUAN`;
            }
        }

        function loadData() {
            db.ref(dbRef).on('value', (snapshot) => {
                const data = snapshot.val();
                globalRequestsData = data ? Object.values(data) : [];
                renderBoard(globalRequestsData);
                renderChart(); // Update chart saat data baru masuk
            });
        }

        // --- FUNGSI RENDER GRAFIK CHART.JS ---
        function renderChart() {
            const ctx = document.getElementById('statsChart').getContext('2d');
            const selectedMonth = parseInt(document.getElementById('chartMonth').value);
            const currentYear = new Date().getFullYear();

            // Siapkan struktur data statistik
            let stats = {};
            globalEmployees.forEach(emp => {
                stats[emp] = { Sakit: 0, Izin: 0, Cuti: 0 };
            });

            // Hitung data
            globalRequestsData.forEach(req => {
                const reqDate = new Date(req.startDate);
                if (reqDate.getMonth() === selectedMonth && reqDate.getFullYear() === currentYear) {
                    if (!stats[req.name]) stats[req.name] = { Sakit: 0, Izin: 0, Cuti: 0 };
                    
                    // Hitung durasi hari (Opsional: Jika ingin hitung per hari. Saat ini dihitung per kali pengajuan)
                    // Jika ingin dihitung per kali pengajuan, cukup +1
                    stats[req.name][req.type] += 1; 
                }
            });

            const labels = Object.keys(stats);
            const dataSakit = labels.map(name => stats[name].Sakit);
            const dataIzin = labels.map(name => stats[name].Izin);
            const dataCuti = labels.map(name => stats[name].Cuti);

            // Jika chart sudah ada, hancurkan dulu sebelum buat baru (mencegah bug hover)
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Sakit', data: dataSakit, backgroundColor: '#ef4444', borderRadius: 4 },
                        { label: 'Izin', data: dataIzin, backgroundColor: '#eab308', borderRadius: 4 },
                        { label: 'Cuti', data: dataCuti, backgroundColor: '#a855f7', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, font: { size: 10 } } }
                    }
                }
            });
        }

        function renderBoard(requests) {
            const board = document.getElementById('board-history');
            board.innerHTML = '';

            if(requests.length === 0) {
                board.innerHTML = `<div class="col-span-full text-center text-xs text-slate-400 py-6 border-2 border-dashed border-slate-200 rounded-3xl">Belum ada data pengajuan.</div>`;
                return;
            }

            requests.sort((a, b) => b.id - a.id).forEach(req => {
                let badgeColor = req.type === 'Sakit' ? 'bg-red-50 text-red-500 border-red-200' : 
                                 req.type === 'Cuti' ? 'bg-purple-50 text-purple-500 border-purple-200' : 
                                 'bg-yellow-50 text-yellow-600 border-yellow-200';
                
                let iconType = req.type === 'Sakit' ? 'ph-thermometer' : 
                               req.type === 'Cuti' ? 'ph-airplane-tilt' : 'ph-envelope-open';

                let proofBtn = req.proofUrl ? 
                    `<button onclick="openModal('${req.proofUrl}')" class="mt-4 w-full bg-slate-50 hover:bg-slate-100 text-blue-600 text-[10px] font-extrabold p-3 rounded-xl uppercase tracking-widest flex justify-center items-center gap-2 transition-colors border border-slate-200">
                        <i class="ph-bold ph-image text-lg"></i> Lihat Bukti Foto
                    </button>` : '';

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-[24px] border border-slate-100 shadow-sm relative";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs uppercase">${req.name.charAt(0)}</div>
                            <div>
                                <h3 class="font-extrabold text-slate-900 text-sm leading-none">${req.name}</h3>
                                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${new Date(parseInt(req.id)).toLocaleDateString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</span>
                            </div>
                        </div>
                        <button onclick="deleteRequest('${req.id}')" class="text-slate-300 hover:text-red-500 transition"><i class="ph-fill ph-trash text-lg"></i></button>
                    </div>
                    <div class="mb-3 flex items-center gap-2">
                        <span class="text-[10px] font-black uppercase tracking-tighter px-2.5 py-1 rounded-lg border flex items-center gap-1 ${badgeColor}">
                            <i class="ph-fill ${iconType}"></i> ${req.type}
                        </span>
                        <span class="text-[10px] font-bold text-slate-500 flex items-center gap-1">
                            <i class="ph-fill ph-calendar-blank"></i> ${formatDateRange(req.startDate, req.endDate)}
                        </span>
                    </div>
                    <p class="text-xs font-medium text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 leading-relaxed">${req.reason}</p>
                    ${proofBtn}
                `;
                board.appendChild(card);
            });
        }

        function formatDateRange(start, end) {
            const opt = { day: 'numeric', month: 'short', year: 'numeric' };
            const s = new Date(start).toLocaleDateString('id-ID', opt);
            const e = new Date(end).toLocaleDateString('id-ID', opt);
            return s === e ? s : `${s} - ${e}`;
        }

        function deleteRequest(id) {
            if(confirm("Hapus data pengajuan ini?")) db.ref(`${dbRef}/${id}`).remove();
        }

        function openModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('modalImg').src = "";
        }

        // --- FITUR DOWNLOAD EXCEL (DIPERBARUI) ---
        function downloadExcel() {
            if(globalRequestsData.length === 0) return alert("Belum ada data untuk di-export.");
            
            const workbook = XLSX.utils.book_new();

            // 1. SHEET PERTAMA: DATA DETAIL (Seperti sebelumnya)
            const detailData = globalRequestsData.sort((a, b) => b.id - a.id).map((req, index) => ({
                "No": index + 1,
                "Nama Tim": req.name,
                "Tipe Izin": req.type,
                "Mulai Tanggal": new Date(req.startDate).toLocaleDateString('id-ID'),
                "Sampai Tanggal": new Date(req.endDate).toLocaleDateString('id-ID'),
                "Alasan Lengkap": req.reason,
                "Waktu Submit": new Date(parseInt(req.id)).toLocaleString('id-ID'),
                "Link Bukti Foto": req.proofUrl ? req.proofUrl : "Tidak ada file"
            }));

            const worksheet1 = XLSX.utils.json_to_sheet(detailData);
            // Merapikan lebar kolom
            worksheet1['!cols'] = [ {wch: 5}, {wch: 20}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 40}, {wch: 20}, {wch: 50} ];
            XLSX.utils.book_append_sheet(workbook, worksheet1, "Data Detail");


            // 2. SHEET KEDUA: REKAPITULASI PER ORANG (Fitur Baru)
            // Hitung rekap berdasarkan bulan yang dipilih di filter (atau semua data jika mau)
            // Di sini kita hitung semua rekap dari data yang ada
            let rekapStats = {};
            globalEmployees.forEach(emp => {
                rekapStats[emp] = { Sakit: 0, Izin: 0, Cuti: 0, Total: 0 };
            });

            globalRequestsData.forEach(req => {
                if (!rekapStats[req.name]) rekapStats[req.name] = { Sakit: 0, Izin: 0, Cuti: 0, Total: 0 };
                rekapStats[req.name][req.type] += 1;
                rekapStats[req.name].Total += 1;
            });

            const rekapDataExcel = [
                ["No", "Nama Pegawai", "Total Sakit (Kali)", "Total Izin (Kali)", "Total Cuti (Kali)", "Total Keseluruhan"]
            ];

            let no = 1;
            for (const [name, data] of Object.entries(rekapStats)) {
                rekapDataExcel.push([no++, name, data.Sakit, data.Izin, data.Cuti, data.Total]);
            }

            const worksheet2 = XLSX.utils.aoa_to_sheet(rekapDataExcel);
            worksheet2['!cols'] = [ {wch: 5}, {wch: 25}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 20} ];
            XLSX.utils.book_append_sheet(workbook, worksheet2, "Rekapitulasi");

            // Save File
            const bulanNama = document.getElementById('chartMonth').options[document.getElementById('chartMonth').selectedIndex].text;
            XLSX.writeFile(workbook, `Rekap_Izin_Molusca_${bulanNama}.xlsx`);
        }
    </script>
</body>
</html>
