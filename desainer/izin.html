<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Izin & Sakit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .upload-area.dragover { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-[#FBFBFE] pb-24 text-slate-800" onload="initApp()">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 py-4 px-6 border-b border-slate-100 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-first-aid text-2xl text-red-500"></i>
            <h1 class="text-lg font-extrabold tracking-tight text-slate-900">Leave<span class="text-red-500">Tracker.</span></h1>
        </div>
        <div class="text-xs font-bold bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full flex items-center gap-1">
            <i class="ph-fill ph-users"></i> Tim Internal
        </div>
    </header>

    <main class="p-4 md:p-8 max-w-3xl mx-auto space-y-8">
        
        <!-- Form Izin/Sakit -->
        <section class="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm">
            <h2 class="text-sm font-extrabold text-slate-900 uppercase tracking-widest mb-4 flex items-center gap-2">
                <i class="ph-fill ph-hand-waving text-red-500 text-lg"></i> Form Pengajuan
            </h2>
            <form id="leaveForm" onsubmit="submitLeave(event)" class="space-y-4">
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <select id="employeeName" required class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold outline-none appearance-none focus:ring-2 focus:ring-red-500/20">
                            <option value="" disabled selected>Pilih Nama</option>
                            <option value="Indah">Indah</option>
                            <option value="Nayla">Nayla</option>
                            <option value="Tya">Tya</option>
                            <option value="Dadan">Dadan</option>
                        </select>
                    </div>
                    <div class="relative">
                        <i class="ph ph-tag absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <select id="leaveType" required class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold outline-none appearance-none focus:ring-2 focus:ring-red-500/20">
                            <option value="Sakit">Sakit</option>
                            <option value="Izin">Izin Keperluan</option>
                            <option value="Cuti">Cuti</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <label class="absolute -top-2 left-4 bg-white px-1 text-[9px] font-black text-slate-400 uppercase tracking-widest rounded">Tanggal Mulai</label>
                        <input type="date" id="startDate" required class="w-full bg-slate-50 border-none rounded-2xl py-4 px-4 text-xs font-bold text-slate-600 focus:ring-2 focus:ring-red-500/20 outline-none">
                    </div>
                    <div class="relative">
                        <label class="absolute -top-2 left-4 bg-white px-1 text-[9px] font-black text-slate-400 uppercase tracking-widest rounded">Sampai Tanggal</label>
                        <input type="date" id="endDate" required class="w-full bg-slate-50 border-none rounded-2xl py-4 px-4 text-xs font-bold text-slate-600 focus:ring-2 focus:ring-red-500/20 outline-none">
                    </div>
                </div>

                <div class="relative">
                    <i class="ph ph-text-align-left absolute left-4 top-4 text-slate-400"></i>
                    <textarea id="leaveReason" required placeholder="Alasan lengkap (Misal: Demam tinggi / Acara keluarga)" rows="2" class="w-full bg-slate-50 border-none rounded-2xl py-4 pl-10 pr-4 text-xs font-bold focus:ring-2 focus:ring-red-500/20 outline-none resize-none"></textarea>
                </div>

                <!-- Custom File Upload -->
                <div class="relative">
                    <input type="file" id="proofImage" accept="image/*" class="hidden" onchange="previewFile()">
                    <label for="proofImage" id="uploadArea" class="upload-area flex flex-col items-center justify-center w-full bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl py-6 cursor-pointer hover:bg-slate-100 transition-all">
                        <i id="uploadIcon" class="ph ph-image text-3xl text-slate-400 mb-2"></i>
                        <span id="uploadText" class="text-xs font-bold text-slate-500">Upload Surat Dokter / Bukti Foto</span>
                        <span class="text-[9px] font-bold text-slate-400 mt-1 uppercase tracking-widest">(Opsional / Wajib jika sakit)</span>
                    </label>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-red-200 transition flex justify-center items-center gap-2 mt-2">
                    <i class="ph-fill ph-paper-plane-right"></i> KIRIM PENGAJUAN
                </button>
            </form>
        </section>

        <!-- Daftar Pengajuan / History -->
        <section>
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2 ml-2">
                <i class="ph-fill ph-clock-counter-clockwise text-lg"></i> Riwayat Pengajuan
            </h2>
            <div id="board-history" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full text-center text-xs text-slate-400 py-8"><i class="ph ph-spinner animate-spin text-2xl mb-2"></i><br>Memuat data...</div>
            </div>
        </section>

    </main>

    <!-- Modal Image Preview -->
    <div id="imageModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] hidden flex justify-center items-center p-4" onclick="closeModal()">
        <img id="modalImg" src="" class="max-w-full max-h-[80vh] rounded-2xl shadow-2xl object-contain">
        <button class="absolute top-6 right-6 text-white bg-white/20 p-2 rounded-full hover:bg-white/40"><i class="ph ph-x text-xl"></i></button>
    </div>

    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyDoX3MZ0hxtL2j3ol3N_1w8ohYCdXPsUtI",
            authDomain: "appmoluscadesign.firebaseapp.com",
            databaseURL: "https://appmoluscadesign-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "appmoluscadesign",
            storageBucket: "appmoluscadesign.firebasestorage.app", // Penting untuk upload gambar
            messagingSenderId: "800709666958",
            appId: "1:800709666958:web:66f97b271f736e17c981df"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();
        const dbRef = 'leave_requests';

        function initApp() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
            loadData();
        }

        // Preview nama file setelah dipilih
        function previewFile() {
            const file = document.getElementById('proofImage').files[0];
            const uploadText = document.getElementById('uploadText');
            const uploadIcon = document.getElementById('uploadIcon');
            if (file) {
                uploadText.innerText = "File siap: " + file.name;
                uploadText.className = "text-xs font-bold text-blue-600";
                uploadIcon.className = "ph-fill ph-check-circle text-3xl text-blue-500 mb-2";
            }
        }

        // Logika Submit Form
        async function submitLeave(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const file = document.getElementById('proofImage').files[0];
            
            const reqData = {
                id: Date.now().toString(),
                name: document.getElementById('employeeName').value,
                type: document.getElementById('leaveType').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                reason: document.getElementById('leaveReason').value,
                timestamp: new Date().toISOString(),
                proofUrl: ""
            };

            btn.disabled = true;
            btn.innerHTML = `<i class="ph ph-spinner animate-spin text-lg"></i> MENGIRIM...`;

            try {
                // Proses upload gambar jika ada
                if (file) {
                    btn.innerHTML = `<i class="ph ph-spinner animate-spin text-lg"></i> UPLOAD FOTO...`;
                    // Bikin folder 'bukti_izin' di Storage
                    const fileRef = storage.ref(`bukti_izin/${reqData.id}_${file.name}`);
                    await fileRef.put(file);
                    reqData.proofUrl = await fileRef.getDownloadURL();
                }

                // Simpan ke Database (Realtime DB)
                btn.innerHTML = `<i class="ph ph-spinner animate-spin text-lg"></i> MENYIMPAN DATA...`;
                await db.ref(`${dbRef}/${reqData.id}`).set(reqData);

                // Reset Form
                document.getElementById('leaveForm').reset();
                document.getElementById('uploadText').innerText = "Upload Surat Dokter / Bukti Foto";
                document.getElementById('uploadText').className = "text-xs font-bold text-slate-500";
                document.getElementById('uploadIcon').className = "ph ph-image text-3xl text-slate-400 mb-2";
                initApp(); // reset dates

                alert("Pengajuan berhasil dikirim!");
            } catch (error) {
                console.error(error);
                alert("Gagal mengirim data: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="ph-fill ph-paper-plane-right"></i> KIRIM PENGAJUAN`;
            }
        }

        // Ambil Data History
        function loadData() {
            db.ref(dbRef).on('value', (snapshot) => {
                const data = snapshot.val();
                const requests = data ? Object.values(data) : [];
                renderBoard(requests);
            });
        }

        function renderBoard(requests) {
            const board = document.getElementById('board-history');
            board.innerHTML = '';

            if(requests.length === 0) {
                board.innerHTML = `<div class="col-span-full text-center text-xs text-slate-400 py-6 border-2 border-dashed border-slate-200 rounded-3xl">Belum ada data pengajuan.</div>`;
                return;
            }

            // Urutkan dari yang terbaru
            requests.sort((a, b) => b.id - a.id).forEach(req => {
                let badgeColor = req.type === 'Sakit' ? 'bg-red-50 text-red-500 border-red-200' : 
                                 req.type === 'Cuti' ? 'bg-purple-50 text-purple-500 border-purple-200' : 
                                 'bg-yellow-50 text-yellow-600 border-yellow-200';
                
                let iconType = req.type === 'Sakit' ? 'ph-thermometer' : 
                               req.type === 'Cuti' ? 'ph-airplane-tilt' : 'ph-envelope-open';

                let proofBtn = req.proofUrl ? 
                    `<button onclick="openModal('${req.proofUrl}')" class="mt-4 w-full bg-slate-50 hover:bg-slate-100 text-blue-600 text-[10px] font-extrabold p-3 rounded-xl uppercase tracking-widest flex justify-center items-center gap-2 transition-colors border border-slate-200">
                        <i class="ph-bold ph-image text-lg"></i> Lihat Bukti Foto
                    </button>` : '';

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-[24px] border border-slate-100 shadow-sm relative";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs uppercase">${req.name.charAt(0)}</div>
                            <div>
                                <h3 class="font-extrabold text-slate-900 text-sm leading-none">${req.name}</h3>
                                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${new Date(parseInt(req.id)).toLocaleDateString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</span>
                            </div>
                        </div>
                        <button onclick="deleteRequest('${req.id}')" class="text-slate-300 hover:text-red-500 transition"><i class="ph-fill ph-trash text-lg"></i></button>
                    </div>
                    
                    <div class="mb-3 flex items-center gap-2">
                        <span class="text-[10px] font-black uppercase tracking-tighter px-2.5 py-1 rounded-lg border flex items-center gap-1 ${badgeColor}">
                            <i class="ph-fill ${iconType}"></i> ${req.type}
                        </span>
                        <span class="text-[10px] font-bold text-slate-500 flex items-center gap-1">
                            <i class="ph-fill ph-calendar-blank"></i> ${formatDateRange(req.startDate, req.endDate)}
                        </span>
                    </div>
                    
                    <p class="text-xs font-medium text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 leading-relaxed">${req.reason}</p>
                    
                    ${proofBtn}
                `;
                board.appendChild(card);
            });
        }

        // Format tanggal jika lebih dari 1 hari
        function formatDateRange(start, end) {
            const opt = { day: 'numeric', month: 'short' };
            const s = new Date(start).toLocaleDateString('id-ID', opt);
            const e = new Date(end).toLocaleDateString('id-ID', opt);
            return s === e ? s : `${s} - ${e}`;
        }

        // Hapus Data
        function deleteRequest(id) {
            if(confirm("Hapus data pengajuan ini?")) {
                db.ref(`${dbRef}/${id}`).remove();
                // Opsional: Hapus file di storage juga jika ingin hemat kapasitas
            }
        }

        // Logic Modal Gambar
        function openModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('modalImg').src = "";
        }
    </script>
</body>
</html>
