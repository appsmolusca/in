<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Konten Molusca</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        #outputBox {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            white-space: pre-wrap;
            display: none; /* Sembunyikan sebelum ada hasil */
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Apps Konten Molusca 🐚</h2>
        <p class="subtitle">AI Instagram Caption Generator untuk Hampers</p>
        
        <textarea id="productInput" placeholder="Masukkan detail hampers di sini... (Contoh: Hampers Idul Fitri isi 3 toples kue kering premium, box kayu estetik, harga promo 150k)"></textarea>
        
        <button id="generateBtn" onclick="generateCaption()">Buat Caption!</button>
        
        <div id="outputBox"></div>
    </div>

    <script>
        async function generateCaption() {
            const inputData = document.getElementById('productInput').value;
            const outputBox = document.getElementById('outputBox');
            const btn = document.getElementById('generateBtn');
            
            if (!inputData.trim()) {
                alert("Harap masukkan detail produk hampers terlebih dahulu!");
                return;
            }

            // UI state: Loading
            btn.disabled = true;
            btn.innerText = "Membuat Caption...";
            outputBox.style.display = "block";
            outputBox.innerText = "Sedang meracik hook terbaik...";
            
            // API Groq (Kompatibel dengan endpoint OpenAI)
            const apiKey = "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";
            
            // Prompt Engineer untuk membatasi output agar sesuai instruksi
            const systemPrompt = `Kamu adalah ahli Social Media Copywriter spesialis Instagram. 
Tugasmu: Buat caption Instagram untuk produk hampers. 
Aturan Wajib: 
1. Sangat SINGKAT, langsung *to the point*.
2. Kalimat pertama WAJIB berupa HOOK yang memancing rasa penasaran atau emosi (berikan jeda spasi/enter setelah hook).
3. Gunakan bahasa Indonesia yang asik, kekinian, namun tetap elegan untuk produk hampers.
4. Sertakan ajakan bertindak (Call to Action) singkat di akhir.`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama3-8b-8192', // Model ringan dan cepat dari Groq
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: inputData }
                        ],
                        temperature: 0.7,
                        max_tokens: 300 // Membatasi panjang agar tetap singkat
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    outputBox.innerText = data.choices[0].message.content;
                } else {
                    outputBox.innerText = "Terjadi kesalahan dari API atau limit tercapai.";
                    console.error(data);
                }
            } catch (error) {
                outputBox.innerText = "Error koneksi: " + error.message;
            } finally {
                // UI state: Reset
                btn.disabled = false;
                btn.innerText = "Buat Caption!";
            }
        }
    </script>
</body>
</html>
