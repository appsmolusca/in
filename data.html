<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Molusca</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#09090b', // Hitam pekat modern
                        surface: '#18181b',    // Abu-abu gelap (zinc-900)
                        border: '#27272a',     // Border tipis (zinc-800)
                        primary: '#ededed',    // Putih text utama (zinc-200)
                        muted: '#a1a1aa'       // Abu-abu text sekunder (zinc-400)
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { background-color: #09090b; color: #ededed; font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar Minimalis Dark */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 1.25rem;
        }
        
        /* Badge Status */
        .badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.02em;
        }
        .badge-final { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-process { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
        
        /* Animasi Kedip untuk Task Urgent (Dark Mode) */
        @keyframes urgent-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }
        .urgent-blink {
            animation: urgent-pulse 1.2s ease-in-out infinite;
            background-color: rgba(239, 68, 68, 0.15); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        
        /* Header Section Divider */
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2.5rem 0 1.5rem 0;
        }
        .section-header::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #27272a;
        }
    </style>
</head>
<body class="antialiased selection:bg-zinc-800 pb-12">

<div class="max-w-[1400px] mx-auto p-4 md:p-6 lg:p-8 space-y-6">
    
    <!-- Header Web -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-2">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
                <i class="ph-fill ph-rocket text-blue-500"></i> Molusca Dashboard
            </h1>
            <p class="text-sm text-muted mt-1 font-medium">Tim Konten & Desain.</p>
        </div>
        <div class="flex items-center gap-3 bg-surface border border-border px-4 py-2.5 rounded-full text-sm shadow-sm font-semibold">
            <span class="flex h-2.5 w-2.5 rounded-full bg-emerald-500 shadow-sm animate-pulse"></span>
            <span class="text-primary" id="currentDate">Memuat tanggal...</span>
        </div>
    </header>

    <!-- Chart / Grafik Global -->
    <div class="card flex flex-col mb-8">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2 text-primary"><i class="ph-bold ph-trend-up text-blue-400"></i> Grafik Produktivitas Global</h2>
        </div>
        <div class="relative w-full h-[220px]">
            <canvas id="productivityChart"></canvas>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- BAGIAN 1: DIVISI KONTEN -->
    <!-- ============================================== -->
    <div class="section-header">
        <h2 class="text-2xl font-black text-white tracking-wide uppercase flex items-center gap-2">
            <i class="ph-fill ph-video-camera text-rose-500"></i> Divisi Konten
        </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 1. Jobdesk -->
        <div class="card flex flex-col h-[350px]">
            <div class="flex items-center justify-between mb-4 border-b border-border pb-3">
                <h3 class="text-base font-bold flex items-center gap-2 text-primary"><i class="ph-bold ph-check-square text-orange-400"></i> List Jobdesk</h3>
                <span class="text-xs bg-orange-500/10 text-orange-400 font-bold px-2.5 py-1 rounded-md border border-orange-500/20" id="jobdeskCount">0</span>
            </div>
            <div class="space-y-3 overflow-y-auto pr-2" id="jobdeskContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>

        <!-- 2. Deadline Hampers -->
        <div class="card flex flex-col h-[350px]">
            <div class="flex items-center justify-between mb-4 border-b border-border pb-3">
                <h3 class="text-base font-bold flex items-center gap-2 text-primary"><i class="ph-bold ph-calendar-blank text-blue-400"></i> Target Deadline</h3>
            </div>
            <div class="space-y-3 overflow-y-auto pr-2" id="creatorTasksContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>

        <!-- 3. Laporan Harian Kreator -->
        <div class="card flex flex-col h-[350px]">
            <div class="flex items-center justify-between mb-4 border-b border-border pb-3">
                <h3 class="text-base font-bold flex items-center gap-2 text-primary"><i class="ph-bold ph-files text-emerald-400"></i> Laporan (2 Hari)</h3>
            </div>
            <div class="space-y-3 overflow-y-auto pr-2" id="creatorReportsContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>
    </div>


    <!-- ============================================== -->
    <!-- BAGIAN 2: DIVISI DESAIN -->
    <!-- ============================================== -->
    <div class="section-header mt-12">
        <h2 class="text-2xl font-black text-white tracking-wide uppercase flex items-center gap-2">
            <i class="ph-fill ph-paint-brush-broad text-purple-500"></i> Divisi Desain
        </h2>
    </div>

    <div>
        <div class="flex items-center justify-between mb-4">
            <p class="text-sm text-muted font-medium">Projek Desain (Hanya menampilkan task yang belum selesai).</p>
        </div>
        
        <!-- Grid Wadah Tim (Kolom per orang) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="teamTasksContainer">
            <!-- Data di-inject JS -->
        </div>
    </div>

</div>

<script>
    // Set Tanggal Hari Ini
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', options);

    // ==========================================
    // DATA MASTER
    // ==========================================
    const data = {
        // Data Konten - Jobdesk
        jobdesk: [
            {"id": 1, "title": "Memastikan barang sudah di take semua", "pic": "Esa", "desc": "Memastikan tidak ada futech tertinggal"}, 
            {"id": 2, "title": "Menanyakan jadwal prodak apa saja", "pic": "Nazma", "desc": "Menanyakan jadwal prodak hari ini ke admin"}, 
            {"id": 3, "title": "Memastikan barang sudah ada", "pic": "El", "desc": "Memastikan prodak sudah siap untuk di-content"}
        ],
        // Data Konten - Tasks & Deadline
        creator_tasks: [
            {"title": "Projek Internal Content", "client": "Internal", "targetDate": "2026-06-20"}, 
            {"title": "1. Tugu Insurance - Miniatur 3d", "client": "sania", "targetDate": "2026-09-12"}, 
            {"title": "wa 892 - 190 pcs gantungan & 200 notebook", "client": "sania", "targetDate": "2026-09-12"}
        ],
        // Data Konten - Laporan
        recent_reports: [
            {"name": "Elfrida", "dateStr": "12-09-2026", "task": "- Edit konten & story hampers InJourney\n- Take konten TikTok\n- Take video hampers PLN"}, 
            {"name": "Esa", "dateStr": "12-09-2026", "task": "- Take tumbler pertamina\n- Take konten tiktok\n- Edit revisi bookmark hmns\n- Edit konten vo pertamina"}
        ],
        
        // Data Desain - Task Belum Selesai (Termasuk yang Urgent)
        uncompleted_tasks: [
            {"joCode": "EXTRA", "title": "DADAN CATEXTILE", "assignee": "Nayla", "dateStr": "2026-09-12", "status": "Nunggu Revisi", "priority": "urgent"},
            {"joCode": "EXTRA", "title": "DADAN TUGU INSURANCE", "assignee": "Nayla", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN NICHI NICHI", "assignee": "Indah", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "DADAN BLIND BOX PLN", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI TAS BATIK", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "Hani Labschool", "assignee": "Indah", "dateStr": "2026-09-09", "status": "Lagi Dikerjain", "priority": "urgent"}, 
            {"joCode": "EXTRA", "title": "HANI AMAZON", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI POLLY POCKER", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PELITA", "assignee": "Indah", "dateStr": "2026-09-03", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN STICKER NAMA", "assignee": "Indah", "dateStr": "2026-08-29", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN HULU MIGAS", "assignee": "Indah", "dateStr": "2026-08-27", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN SATYA JKN", "assignee": "Indah", "dateStr": "2026-08-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI WM", "assignee": "Nayla", "dateStr": "2026-08-18", "status": "Tinggal Layout", "priority": "normal"},
            {"joCode": "JO KAK TANIA", "title": "injourney", "assignee": "Nayla", "dateStr": "2026-08-10", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI NOVO NORDISK", "assignee": "Indah", "dateStr": "2026-07-29", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PLN JABARDI", "assignee": "Indah", "dateStr": "2026-07-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "DADAN FLUFFY LAB", "assignee": "Nayla", "dateStr": "2026-07-22", "status": "Nunggu Revisi", "priority": "normal"}
        ]
    };

    // ==========================================
    // UTILS
    // ==========================================
    function getStatusBadge(status) {
        const s = status.toLowerCase();
        if (s.includes('final')) return `<span class="badge badge-final">Final</span>`;
        if (s.includes('revisi') || s.includes('to-do')) return `<span class="badge badge-pending">${status}</span>`;
        return `<span class="badge badge-process">${status}</span>`;
    }

    function getPriorityBadge(priority) {
        if ((priority || "").toLowerCase() === 'urgent') {
            return `<span class="urgent-blink uppercase"><i class="ph-fill ph-warning-circle"></i> URGENT</span>`;
        }
        return ``;
    }

    // ==========================================
    // RENDER: DIVISI KONTEN
    // ==========================================
    
    // 1. Jobdesk
    document.getElementById('jobdeskCount').innerText = data.jobdesk.length;
    const jobdeskHtml = data.jobdesk.map(item => `
        <div class="flex items-start gap-3 p-3 bg-zinc-900 border border-border rounded-lg hover:border-zinc-700 transition-colors">
            <div class="mt-0.5 text-blue-400"><i class="ph-fill ph-check-circle"></i></div>
            <div class="flex-1">
                <p class="text-sm text-primary font-bold leading-tight">${item.title}</p>
                <p class="text-xs text-muted mt-1 font-medium">${item.desc}</p>
            </div>
            <div class="flex items-center gap-1 bg-zinc-800 border border-zinc-700 px-2 py-1 rounded">
                <span class="text-xs font-bold text-zinc-300">${item.pic}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('jobdeskContainer').innerHTML = jobdeskHtml;

    // 2. Creator Tasks (Deadline)
    const cTaskHtml = data.creator_tasks.map(c => `
        <div class="p-3.5 bg-zinc-900 border-l-4 border-l-blue-500 border border-border rounded-lg hover:border-zinc-700 transition-colors">
            <p class="text-sm font-bold text-primary line-clamp-2">${c.title}</p>
            <div class="flex items-center justify-between mt-3 text-xs">
                <span class="text-zinc-400 font-bold bg-zinc-800 px-2 py-1 rounded"><i class="ph-bold ph-user mr-1"></i>${c.client}</span>
                <span class="text-blue-400 font-mono font-bold"><i class="ph-bold ph-clock mr-1"></i>${c.targetDate}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('creatorTasksContainer').innerHTML = cTaskHtml;

    // 3. Creator Reports
    const cReportHtml = data.recent_reports.map(r => `
        <div class="p-4 bg-zinc-900 border border-border rounded-lg relative overflow-hidden">
            <div class="absolute top-0 right-0 p-2 opacity-5"><i class="ph-fill ph-quotes text-5xl text-white"></i></div>
            <div class="flex items-center gap-3 mb-3 border-b border-border pb-2">
                <div class="h-8 w-8 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-sm font-black">${r.name.charAt(0)}</div>
                <span class="text-sm font-extrabold text-primary">${r.name}</span>
                <span class="text-[10px] text-muted font-mono ml-auto bg-zinc-800 px-2 py-1 rounded">${r.dateStr}</span>
            </div>
            <div class="text-xs text-zinc-400 whitespace-pre-line leading-relaxed font-semibold pl-1">${r.task}</div>
        </div>
    `).join('');
    document.getElementById('creatorReportsContainer').innerHTML = cReportHtml;


    // ==========================================
    // RENDER: DIVISI DESAIN (TEAM GRID)
    // ==========================================
    const teamMembers = ["Indah", "Nayla", "Tya", "Dadan"];
    const groupedTasks = {};
    
    // Inisialisasi awal (agar yang task 0 tetap muncul)
    teamMembers.forEach(m => groupedTasks[m] = []);

    // Masukkan data task
    data.uncompleted_tasks.forEach(task => {
        const name = task.assignee.charAt(0).toUpperCase() + task.assignee.slice(1).toLowerCase();
        if(groupedTasks[name] !== undefined) {
            groupedTasks[name].push(task);
        } else {
            groupedTasks[name] = [task];
        }
    });

    const teamContainer = document.getElementById('teamTasksContainer');
    let teamHtml = '';

    // Warna pastel gelap untuk avatar di dark mode
    const colors = ['bg-blue-500/20 text-blue-400 border-blue-500/30', 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', 'bg-purple-500/20 text-purple-400 border-purple-500/30', 'bg-orange-500/20 text-orange-400 border-orange-500/30'];
    let colorIndex = 0;

    for(const [assignee, tasks] of Object.entries(groupedTasks)) {
        const avatarColor = colors[colorIndex % colors.length];
        colorIndex++;

        teamHtml += `
        <div class="card flex flex-col h-[400px]">
            <div class="flex items-center justify-between mb-4 border-b border-border pb-3">
                <div class="flex items-center gap-2.5">
                    <div class="h-9 w-9 rounded-full ${avatarColor} border flex items-center justify-center font-black text-lg">
                        ${assignee.charAt(0)}
                    </div>
                    <h3 class="font-extrabold text-primary text-lg">${assignee}</h3>
                </div>
                <span class="${tasks.length > 0 ? 'bg-zinc-800 text-zinc-300 border-zinc-700' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'} text-xs font-bold px-2.5 py-1 rounded-md border">${tasks.length} Task</span>
            </div>
            
            <div class="overflow-y-auto pr-1 flex-1">
                ${tasks.length > 0 ? `<div class="space-y-3">` + tasks.map(t => `
                    <div class="p-3 border rounded-lg transition-all ${t.priority?.toLowerCase() === 'urgent' ? 'bg-red-500/10 border-red-500/30' : 'bg-zinc-900 border-border hover:border-zinc-600'}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold text-zinc-400 bg-zinc-800 border border-zinc-700 px-1.5 py-0.5 rounded shadow-sm">${t.joCode}</span>
                            ${getStatusBadge(t.status)}
                        </div>
                        <p class="text-sm font-bold text-primary leading-tight mb-2">${t.title}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-[10px] text-zinc-500 font-bold font-mono bg-zinc-950 px-1.5 py-0.5 rounded border border-zinc-800"><i class="ph-bold ph-calendar-blank"></i> ${t.dateStr}</span>
                            ${getPriorityBadge(t.priority)}
                        </div>
                    </div>
                `).join('') + `</div>` : `
                    <!-- EMPTY STATE JIKA TASK 0 (Semua Clear) -->
                    <div class="flex flex-col items-center justify-center h-full text-center pb-8 opacity-80">
                        <i class="ph-fill ph-check-circle text-6xl text-emerald-500/70 mb-3 drop-shadow-sm"></i>
                        <p class="text-sm font-extrabold text-zinc-300">Semua Clear!</p>
                        <p class="text-xs font-medium text-zinc-500 mt-1">Kerjaan sudah beres semua.</p>
                    </div>
                `}
            </div>
        </div>
        `;
    }
    teamContainer.innerHTML = teamHtml;


    // ==========================================
    // INIT CHART.JS (DARK THEME)
    // ==========================================
    const ctx = document.getElementById('productivityChart').getContext('2d');
    
    const chartLabels = ["2 Sep", "3 Sep", "4 Sep", "7 Sep", "8 Sep", "9 Sep", "10 Sep", "11 Sep", "12 Sep"];
    const designTrend = [1, 5, 2, 6, 2, 5, 5, 2, 3];
    const contentTrend = [0, 0, 0, 0, 0, 0, 0, 0, 4];

    Chart.defaults.color = '#a1a1aa'; 
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.font.weight = '600';

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartLabels,
            datasets: [
                {
                    label: 'Project Desain',
                    data: designTrend,
                    borderColor: '#3b82f6', 
                    backgroundColor: 'rgba(59, 130, 246, 0.15)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#09090b',
                    pointBorderColor: '#3b82f6',
                    pointBorderWidth: 2,
                    pointRadius: 4
                },
                {
                    label: 'Project Konten',
                    data: contentTrend,
                    borderColor: '#10b981',  
                    backgroundColor: 'rgba(16, 185, 129, 0.15)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#09090b',
                    pointBorderColor: '#10b981',
                    pointBorderWidth: 2,
                    pointRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { boxWidth: 12, usePointStyle: true, color: '#ededed', font: { weight: 'bold' } } },
                tooltip: { backgroundColor: '#18181b', borderColor: '#27272a', borderWidth: 1, titleColor: '#ededed', bodyColor: '#a1a1aa', padding: 10, cornerRadius: 8 }
            },
            scales: {
                y: { beginAtZero: true, grid: { color: '#27272a', drawBorder: false }, border: { dash: [4, 4] } },
                x: { grid: { display: false, drawBorder: false } }
            }
        }
    });
</script>
</body>
</html>
