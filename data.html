<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Molusca Workspace | Minimalist</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgWarm: '#FDFBF7',     // Warm off-white
                        surface: '#FFFFFF',    // Pure white
                        borderWarm: '#F0EBE1', // Light warm gray border
                        textDark: '#3F3931',   // Dark warm brown/gray for primary text
                        textMuted: '#8C8477',  // Muted warm gray
                        accentWarm: '#D97706', // Amber
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { background-color: #FDFBF7; color: #3F3931; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* Custom Scrollbar Minimalis */
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5DFD3; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D0C8B6; }

        .card {
            background-color: #FFFFFF;
            border: 1px solid #F0EBE1;
            border-radius: 10px;
            padding: 1.25rem;
        }
        
        /* Badge Status Minimalis */
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: capitalize;
            letter-spacing: 0.02em;
        }
        .badge-final { background: #F0FDF4; color: #15803D; border: 1px solid #DCFCE7; }
        .badge-pending { background: #FFFBEB; color: #B45309; border: 1px solid #FEF3C7; }
        .badge-process { background: #F8FAFC; color: #475569; border: 1px solid #E2E8F0; } /* Abu-abu netral */
        
        /* Animasi Kedip Halus (Urgent) */
        @keyframes soft-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .urgent-blink {
            animation: soft-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            color: #DC2626; 
            font-weight: 700;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: #FEF2F2;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #FEE2E2;
        }
    </style>
</head>
<body class="selection:bg-amber-100 pb-12 text-[13px]">

<div class="max-w-[1200px] mx-auto p-4 md:p-6 lg:p-8 space-y-6">
    
    <!-- Header -->
    <header class="flex flex-row justify-between items-center mb-2">
        <div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-textDark flex items-center gap-1.5">
                <i class="ph-fill ph-leaf text-accentWarm"></i> molusca.
            </h1>
            <p class="text-[11px] text-textMuted mt-0.5">Workspace & Tim Log</p>
        </div>
        <div class="flex items-center gap-2 bg-surface border border-borderWarm px-3 py-1.5 rounded-full text-[11px] font-medium text-textDark">
            <span class="flex h-1.5 w-1.5 rounded-full bg-accentWarm"></span>
            <span id="currentDate">--</span>
        </div>
    </header>

    <!-- Baris 1: Kurva & Jobdesk -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
        
        <!-- Jobdesk (To-Do) - Pindah ke Kiri di Desktop agar lebih seimbang -->
        <div class="card flex flex-col order-2 lg:order-1">
            <div class="flex items-center justify-between mb-4 border-b border-borderWarm pb-2">
                <h2 class="text-[13px] font-semibold text-textDark flex items-center gap-1.5"><i class="ph-bold ph-list-checks text-textMuted"></i> Jobdesk (To-Do)</h2>
                <span class="text-[10px] bg-[#F5F2EA] text-textDark font-semibold px-2 py-0.5 rounded" id="jobdeskCount">0</span>
            </div>
            <div class="space-y-2 overflow-y-auto max-h-[200px] pr-1" id="jobdeskContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>

        <!-- Chart -->
        <div class="card flex flex-col order-1 lg:order-2 lg:col-span-2">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-[13px] font-semibold text-textDark flex items-center gap-1.5"><i class="ph-bold ph-chart-line-up text-textMuted"></i> Produktivitas</h2>
            </div>
            <div class="relative flex-1 min-h-[180px] w-full">
                <canvas id="productivityChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Baris 2: Task per Desainer -->
    <div class="mt-6">
        <div class="flex items-center justify-between mb-3 border-b border-borderWarm pb-2">
            <h2 class="text-sm font-bold text-textDark flex items-center gap-1.5">
                <i class="ph-bold ph-paint-brush text-textMuted"></i> Beban Kerja Tim Desain
            </h2>
            <div class="text-[10px] text-textMuted font-medium flex items-center gap-1">
                Menampilkan task berjalan
            </div>
        </div>
        
        <!-- Grid Wadah Tim (1 Kolom HP, 2 Tablet, 4 Desktop) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="teamTasksContainer">
            <!-- Data di-inject JS -->
        </div>
    </div>

    <!-- Baris 3: Kreator Task -->
    <div class="mt-6">
        <div class="flex items-center justify-between mb-3 border-b border-borderWarm pb-2">
            <h2 class="text-sm font-bold text-textDark flex items-center gap-1.5">
                <i class="ph-bold ph-video-camera text-textMuted"></i> Kreator Konten
            </h2>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Target Deadline -->
            <div class="card flex flex-col">
                <h3 class="text-[11px] font-semibold text-textMuted mb-3 flex items-center gap-1 uppercase tracking-wider"><i class="ph-bold ph-calendar-blank"></i> Target Deadline</h3>
                <div class="space-y-2.5 overflow-y-auto max-h-[250px] pr-1" id="creatorTasksContainer"></div>
            </div>
            
            <!-- Laporan Kerja -->
            <div class="card flex flex-col">
                <h3 class="text-[11px] font-semibold text-textMuted mb-3 flex items-center gap-1 uppercase tracking-wider"><i class="ph-bold ph-files"></i> Laporan (2 Hari)</h3>
                <div class="space-y-2.5 overflow-y-auto max-h-[250px] pr-1" id="creatorReportsContainer"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Format Tanggal Minimalis (Cth: 14 Sep 2026)
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', options);

    // ==========================================
    // 1. DATA MASTER
    // ==========================================
    const data = {
        jobdesk: [
            {"id": 1, "title": "Memastikan barang sudah di take semua", "pic": "Esa", "desc": "Tidak ada futech tertinggal"}, 
            {"id": 2, "title": "Menanyakan jadwal prodak", "pic": "Nazma", "desc": "Tanya jadwal ke admin"}, 
            {"id": 3, "title": "Memastikan barang sudah ada", "pic": "El", "desc": "Prodak siap untuk di-content"}
        ],
        // Task Desain Belum Selesai (Termasuk label urgent)
        uncompleted_tasks: [
            {"joCode": "EXTRA", "title": "DADAN CATEXTILE", "assignee": "Nayla", "dateStr": "2026-09-12", "status": "Nunggu Revisi", "priority": "urgent"},
            {"joCode": "EXTRA", "title": "DADAN TUGU INSURANCE", "assignee": "Nayla", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN NICHI NICHI", "assignee": "Indah", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "DADAN BLIND BOX PLN", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI TAS BATIK", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "Hani Labschool", "assignee": "Indah", "dateStr": "2026-09-09", "status": "Lagi Dikerjain", "priority": "urgent"}, 
            {"joCode": "EXTRA", "title": "HANI AMAZON", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI POLLY POCKER", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PELITA", "assignee": "Indah", "dateStr": "2026-09-03", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN STICKER NAMA", "assignee": "Indah", "dateStr": "2026-08-29", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN HULU MIGAS", "assignee": "Indah", "dateStr": "2026-08-27", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN SATYA JKN", "assignee": "Indah", "dateStr": "2026-08-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI WM", "assignee": "Nayla", "dateStr": "2026-08-18", "status": "Tinggal Layout", "priority": "normal"},
            {"joCode": "JO KAK TANIA", "title": "injourney", "assignee": "Nayla", "dateStr": "2026-08-10", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI NOVO NORDISK", "assignee": "Indah", "dateStr": "2026-07-29", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PLN JABARDI", "assignee": "Indah", "dateStr": "2026-07-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "DADAN FLUFFY LAB", "assignee": "Nayla", "dateStr": "2026-07-22", "status": "Nunggu Revisi", "priority": "normal"}
        ],
        creator_tasks: [
            {"title": "Projek Internal Content", "client": "Internal", "targetDate": "2026-06-20"}, 
            {"title": "1. Tugu Insurance - Miniatur 3d", "client": "sania", "targetDate": "2026-09-12"}, 
            {"title": "wa 892 - 190 pcs gantungan & 200 notebook", "client": "sania", "targetDate": "2026-09-12"}
        ],
        recent_reports: [
            {"name": "Elfrida", "dateStr": "12-09-2026", "task": "• Edit konten & story hampers InJourney\n• Take konten TikTok\n• Take video hampers PLN"}, 
            {"name": "Esa", "dateStr": "12-09-2026", "task": "• Take tumbler pertamina\n• Take konten tiktok\n• Edit revisi bookmark hmns\n• Edit konten vo pertamina"}
        ]
    };

    // ==========================================
    // UTILS
    // ==========================================
    function getStatusBadge(status) {
        const s = status.toLowerCase();
        if (s.includes('final')) return `<span class="badge badge-final">Final</span>`;
        if (s.includes('revisi') || s.includes('to-do')) return `<span class="badge badge-pending">${status}</span>`;
        return `<span class="badge badge-process">${status}</span>`;
    }

    function getPriorityBadge(priority) {
        if ((priority || "").toLowerCase() === 'urgent') {
            return `<span class="urgent-blink"><i class="ph-fill ph-warning-circle"></i> Urgent</span>`;
        }
        return ``;
    }

    // Ubah format string date 2026-09-12 ke 12 Sep (lebih kecil & bersih)
    function formatShortDate(dateStr) {
        if(!dateStr) return "";
        const parts = dateStr.split('-');
        if(parts.length === 3) {
            const date = new Date(parts[0], parts[1]-1, parts[2]);
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        }
        return dateStr;
    }

    // ==========================================
    // 2. RENDER JOBDESK
    // ==========================================
    document.getElementById('jobdeskCount').innerText = data.jobdesk.length;
    const jobdeskHtml = data.jobdesk.map(item => `
        <div class="flex items-start gap-2.5 p-2.5 bg-surface border border-borderWarm rounded-lg">
            <div class="mt-0.5 text-textMuted"><i class="ph-bold ph-check-circle"></i></div>
            <div class="flex-1">
                <p class="text-[12px] text-textDark font-medium leading-tight">${item.title}</p>
                <p class="text-[10px] text-textMuted mt-0.5">${item.desc}</p>
            </div>
            <div class="bg-[#F5F2EA] px-1.5 py-0.5 rounded">
                <span class="text-[10px] font-semibold text-textDark">${item.pic}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('jobdeskContainer').innerHTML = jobdeskHtml;

    // ==========================================
    // 3. RENDER TASK DESAIN
    // ==========================================
    const teamMembers = ["Indah", "Nayla", "Tya", "Dadan"];
    const groupedTasks = {};
    teamMembers.forEach(m => groupedTasks[m] = []);

    data.uncompleted_tasks.forEach(task => {
        const name = task.assignee.charAt(0).toUpperCase() + task.assignee.slice(1).toLowerCase();
        if(groupedTasks[name] !== undefined) groupedTasks[name].push(task);
        else groupedTasks[name] = [task];
    });

    const teamContainer = document.getElementById('teamTasksContainer');
    let teamHtml = '';

    for(const [assignee, tasks] of Object.entries(groupedTasks)) {
        teamHtml += `
        <div class="card flex flex-col h-[350px] p-3 md:p-4">
            <div class="flex items-center justify-between mb-3 border-b border-borderWarm pb-2">
                <div class="flex items-center gap-2">
                    <div class="h-6 w-6 rounded bg-[#F5F2EA] flex items-center justify-center font-bold text-[11px] text-textDark">
                        ${assignee.charAt(0)}
                    </div>
                    <h3 class="font-semibold text-textDark text-[13px]">${assignee}</h3>
                </div>
                <span class="${tasks.length > 0 ? 'text-textMuted' : 'text-[#15803D] bg-[#F0FDF4] border-[#DCFCE7] px-1.5 py-0.5 border rounded'} text-[10px] font-medium">${tasks.length} Task</span>
            </div>
            
            <div class="overflow-y-auto pr-1 flex-1">
                ${tasks.length > 0 ? `<div class="space-y-2">` + tasks.map(t => `
                    <div class="p-2.5 border border-borderWarm rounded-lg ${t.priority?.toLowerCase() === 'urgent' ? 'bg-[#FEF2F2] border-[#FEE2E2]' : 'bg-surface'}">
                        <div class="flex justify-between items-start mb-1.5">
                            <span class="text-[9px] font-medium text-textMuted bg-[#F5F2EA] px-1 rounded">${t.joCode}</span>
                            ${getStatusBadge(t.status)}
                        </div>
                        <p class="text-[12px] font-medium text-textDark leading-snug mb-2">${t.title}</p>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[9px] text-textMuted font-medium flex items-center gap-1"><i class="ph-bold ph-calendar-blank"></i> ${formatShortDate(t.dateStr)}</span>
                            ${getPriorityBadge(t.priority)}
                        </div>
                    </div>
                `).join('') + `</div>` : `
                    <div class="flex flex-col items-center justify-center h-full text-center pb-6 opacity-60">
                        <i class="ph-light ph-coffee text-3xl text-textMuted mb-2"></i>
                        <p class="text-[11px] font-medium text-textDark">Tidak ada task.</p>
                        <p class="text-[10px] text-textMuted mt-0.5">Semua kerjaan selesai.</p>
                    </div>
                `}
            </div>
        </div>
        `;
    }
    teamContainer.innerHTML = teamHtml;

    // ==========================================
    // 4. RENDER KREATOR TASK & REPORT
    // ==========================================
    const cTaskHtml = data.creator_tasks.map(c => `
        <div class="p-2.5 bg-surface border border-borderWarm rounded-lg">
            <p class="text-[12px] font-medium text-textDark line-clamp-2">${c.title}</p>
            <div class="flex items-center justify-between mt-2">
                <span class="text-[10px] text-textMuted flex items-center gap-1 bg-[#F5F2EA] px-1.5 rounded"><i class="ph-bold ph-user"></i> ${c.client}</span>
                <span class="text-[10px] text-accentWarm font-medium flex items-center gap-1"><i class="ph-bold ph-clock"></i> ${formatShortDate(c.targetDate)}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('creatorTasksContainer').innerHTML = cTaskHtml;

    const cReportHtml = data.recent_reports.map(r => `
        <div class="p-3 bg-surface border border-borderWarm rounded-lg">
            <div class="flex items-center gap-2 mb-2">
                <div class="h-5 w-5 rounded bg-[#F5F2EA] flex items-center justify-center text-[10px] font-bold text-textDark">${r.name.charAt(0)}</div>
                <span class="text-[12px] font-semibold text-textDark">${r.name}</span>
                <span class="text-[9px] text-textMuted ml-auto border border-borderWarm px-1.5 py-0.5 rounded">${r.dateStr}</span>
            </div>
            <div class="text-[11px] text-textMuted whitespace-pre-line leading-relaxed">${r.task}</div>
        </div>
    `).join('');
    document.getElementById('creatorReportsContainer').innerHTML = cReportHtml;

    // ==========================================
    // 5. INIT CHART.JS 
    // ==========================================
    const ctx = document.getElementById('productivityChart').getContext('2d');
    
    // Ganti format label biar muat di HP (Cth: 2 Sep)
    const chartLabels = ["2 Sep", "3 Sep", "4 Sep", "7 Sep", "8 Sep", "9 Sep", "10 Sep", "11 Sep", "12 Sep"];
    const designTrend = [1, 5, 2, 6, 2, 5, 5, 2, 3];
    const contentTrend = [0, 0, 0, 0, 0, 0, 0, 0, 4];

    Chart.defaults.color = '#8C8477'; 
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.font.size = 10;

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartLabels,
            datasets: [
                {
                    label: 'Desain',
                    data: designTrend,
                    borderColor: '#3F3931', // Dark Warm
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    tension: 0.3,
                    pointBackgroundColor: '#3F3931',
                    pointRadius: 2.5
                },
                {
                    label: 'Konten',
                    data: contentTrend,
                    borderColor: '#D97706', // Amber 
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    tension: 0.3,
                    pointBackgroundColor: '#D97706',
                    pointRadius: 2.5
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { 
                    position: 'top', 
                    align: 'end',
                    labels: { boxWidth: 6, usePointStyle: true, color: '#3F3931', font: { size: 10 } } 
                },
                tooltip: { 
                    backgroundColor: '#FFFFFF', 
                    titleColor: '#3F3931', 
                    bodyColor: '#8C8477', 
                    borderColor: '#F0EBE1', 
                    borderWidth: 1,
                    padding: 8,
                    titleFont: { size: 11 },
                    bodyFont: { size: 10 }
                }
            },
            scales: {
                y: { beginAtZero: true, grid: { color: '#F0EBE1', drawBorder: false }, border: { dash: [3, 3] }, ticks: { stepSize: 2 } },
                x: { grid: { display: false, drawBorder: false } }
            }
        }
    });
</script>
</body>
</html>
