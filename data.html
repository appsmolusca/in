<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Molusca | Live Sheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; transition: background-color 0.3s ease, color 0.3s ease; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .badge { padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: capitalize; letter-spacing: 0.02em; }
        @keyframes urgent-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.98); } }
        .urgent-blink { animation: urgent-pulse 1.5s ease-in-out infinite; font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 10px; display: inline-flex; align-items: center; gap: 2px; }
        .section-header { display: flex; align-items: center; gap: 1rem; margin: 4rem 0 1.5rem 0; }
        .section-header::after { content: ""; flex: 1; height: 1px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-zinc-950 dark:text-zinc-100 pb-16 text-[13px]"> 

<div class="max-w-[1200px] mx-auto p-4 md:p-6 lg:p-8 space-y-6">
    
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 md:mb-10 mt-2">
        <div>
            <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                <i class="ph-fill ph-rocket text-blue-500"></i> Molusca App <span id="loadingIndicator" class="ml-2 hidden loader"></span>
            </h1>
            <p class="text-[11px] md:text-xs text-slate-500 dark:text-zinc-400 mt-1 font-medium">Data LIVE ditarik otomatis dari Google Sheets.</p>
        </div>
        
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 px-3 py-1.5 rounded-full text-[11px] shadow-sm font-semibold transition-colors">
                <span id="statusDot" class="flex h-2 w-2 rounded-full bg-emerald-500 shadow-sm animate-pulse"></span>
                <span class="text-slate-700 dark:text-zinc-200" id="currentDate">--</span>
            </div>
            <button id="themeToggle" class="flex items-center justify-center h-8 w-8 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-full shadow-sm text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                <i id="themeIcon" class="ph-bold ph-moon text-lg"></i>
            </button>
        </div>
    </header>

    <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col mb-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-[14px] font-bold flex items-center gap-2 text-slate-800 dark:text-zinc-100"><i class="ph-bold ph-trend-up text-blue-500"></i> Produktivitas Global</h2>
        </div>
        <div class="relative w-full h-[180px] md:h-[220px]"><canvas id="productivityChart"></canvas></div>
    </div>

    <!-- DIVISI KONTEN -->
    <div class="section-header after:bg-slate-200 dark:after:bg-zinc-800">
        <h2 class="text-base md:text-lg font-black text-slate-900 dark:text-white tracking-wide uppercase flex items-center gap-2"><i class="ph-fill ph-video-camera text-rose-500"></i> Divisi Konten</h2>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col h-[320px]">
            <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                <h3 class="text-[13px] font-bold flex items-center gap-1.5 text-slate-800 dark:text-zinc-100"><i class="ph-bold ph-calendar-blank text-blue-500"></i> Target Deadline</h3>
                <span class="text-[10px] bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400 font-bold px-2 py-0.5 rounded border border-blue-200 dark:border-blue-500/20" id="creatorTaskCount">0</span>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="creatorTasksContainer"><p class="text-xs text-slate-400 text-center mt-10">Memuat data...</p></div>
        </div>
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col h-[320px]">
            <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                <h3 class="text-[13px] font-bold flex items-center gap-1.5 text-slate-800 dark:text-zinc-100"><i class="ph-bold ph-files text-emerald-500"></i> Laporan (2 Hari)</h3>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="creatorReportsContainer"><p class="text-xs text-slate-400 text-center mt-10">Memuat data...</p></div>
        </div>
    </div>

    <!-- DIVISI DESAIN GRAFIS -->
    <div class="section-header after:bg-slate-200 dark:after:bg-zinc-800">
        <h2 class="text-base md:text-lg font-black text-slate-900 dark:text-white tracking-wide uppercase flex items-center gap-2"><i class="ph-fill ph-paint-brush-broad text-purple-500"></i> Divisi Desain Grafis</h2>
    </div>
    <div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4 md:gap-6" id="teamTasksContainer"><p class="text-xs text-slate-400 col-span-full">Memuat data tim desain...</p></div>
    </div>

    <!-- DIVISI 3D & PRODUKSI -->
    <div class="section-header after:bg-slate-200 dark:after:bg-zinc-800">
        <h2 class="text-base md:text-lg font-black text-slate-900 dark:text-white tracking-wide uppercase flex items-center gap-2"><i class="ph-fill ph-cube text-emerald-500"></i> Divisi 3D & Produksi</h2>
    </div>
    <div class="mb-10">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4 md:gap-6" id="teamTasks3dContainer"><p class="text-xs text-slate-400 col-span-full">Memuat data tim 3D...</p></div>
    </div>

</div>

<script>
    const SPREADSHEET_ID = '1d3njy330ifMnm-uBD8daaey5AqYO3rQxaI-tLZQdeyI';

    const loadingIndicator = document.getElementById('loadingIndicator');
    const statusDot = document.getElementById('statusDot');

    function updateDateTime() {
        const now = new Date();
        document.getElementById('currentDate').innerText = `${now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })} • ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} WIB`;
    }
    setInterval(updateDateTime, 1000); updateDateTime();

    // ==========================================
    // API FETCHER ANTI-ERROR (BOMB PROOF)
    // ==========================================
    async function fetchSheetData(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
        try {
            const response = await fetch(url);
            const text = await response.text();
            const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
            const json = JSON.parse(jsonStr);
            
            let cols = json.table.cols.map(c => c ? String(c.label).trim() : '');
            let rows = json.table.rows;

            // BOMB PROOF 1: Jika Google Sheets gak ngebaca baris pertama sebagai Header
            if (cols.every(c => c === '') && rows.length > 0) {
                cols = rows[0].c.map(c => c ? String(c.v).trim() : '');
                rows = rows.slice(1);
            }
            if (cols.every(c => c === '')) return [];

            return rows.map(r => {
                if (!r || !r.c) return null;
                let row = {};
                r.c.forEach((c, i) => {
                    if (cols[i]) {
                        row[cols[i]] = c ? (c.f !== undefined && c.f !== null ? String(c.f) : String(c.v)) : '';
                    }
                });
                return row;
            }).filter(r => r !== null);
        } catch (error) {
            console.error(`Gagal memuat sheet ${sheetName}:`, error);
            return [];
        }
    }

    // BOMB PROOF 2: Cerdas Nyari Nama Kolom walau ada Typo/Huruf Besar Kecil
    function getVal(row, keyOptions) {
        if (!row) return '';
        for (let opt of keyOptions) {
            const target = opt.toLowerCase().replace(/[^a-z0-9]/g, ''); 
            for (let rowKey in row) {
                const current = rowKey.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (current === target) return row[rowKey];
            }
        }
        return '';
    }

    // ==========================================
    // UTILS FORMAT TANGGAL & TEXT
    // ==========================================
    function parseToDateObj(dateStr) {
        if (!dateStr) return new Date(0);
        let str = String(dateStr).trim();
        if (str.startsWith('Date(')) {
            const match = str.match(/Date\((\d+),\s*(\d+),\s*(\d+)/);
            if (match) return new Date(match[1], match[2], match[3]);
        }
        if (str.match(/^\d{1,2}[-\/]\d{1,2}[-\/]\d{4}/)) {
            const parts = str.split(/[-\/]/); return new Date(parts[2].split(/[ T]/)[0], parseInt(parts[1]) - 1, parseInt(parts[0]));
        }
        if (str.match(/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/)) {
            const parts = str.split(/[-\/]/); return new Date(parts[0], parseInt(parts[1]) - 1, parseInt(parts[2].split(/[ T]/)[0]));
        }
        return new Date(str);
    }

    function formatShortDate(dateInput) {
        if (!dateInput) return "";
        let d = dateInput instanceof Date ? dateInput : parseToDateObj(dateInput);
        if (!isNaN(d.getTime()) && d.getTime() !== 0) return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        return String(dateInput).substring(0, 10);
    }

    function getStandardDateString(dateInput) {
        let d = parseToDateObj(dateInput);
        if(!isNaN(d.getTime()) && d.getTime() !== 0) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        return String(dateInput);
    }

    function cleanTimeStr(val) {
        if (!val || val === '-') return '-';
        let s = String(val);
        if (s.includes('T')) return s.split('T')[1].substring(0, 5);
        return s;
    }

    function formatName(rawName) {
        let s = String(rawName || '').trim();
        if(!s) return 'Unknown';
        return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
    }

    function getStatusBadge(status) {
        const s = String(status || '').toLowerCase();
        if (s.includes('final')) return `<span class="badge bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-400 border dark:border-emerald-500/30">Final</span>`;
        if (s.includes('revisi') || s.includes('to-do')) return `<span class="badge bg-amber-50 text-amber-600 border-amber-200 dark:bg-amber-500/15 dark:text-amber-400 border dark:border-amber-500/30">${String(status)}</span>`;
        return `<span class="badge bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/15 dark:text-blue-400 border dark:border-blue-500/30">${String(status || 'Lagi Dikerjain')}</span>`;
    }

    // ==========================================
    // FUNGSI UTAMA LOAD DATA
    // ==========================================
    async function initDashboard() {
        try {
            loadingIndicator.classList.remove('hidden');
            statusDot.classList.replace('bg-emerald-500', 'bg-amber-500');

            const [rawTasks, rawCreatorTasks, rawCreatorReports, rawTasks3d] = await Promise.all([
                fetchSheetData('tasks'), fetchSheetData('creator_tasks'), fetchSheetData('creator_reports'), fetchSheetData('tasks_3d')
            ]);

            // STANDARISASI DATA ANTI-ERROR
            const creatorTasks = rawCreatorTasks.map(t => ({ id: getVal(t, ['id']), title: getVal(t, ['title','task','judul']), client: getVal(t, ['client','klien']), targetDate: getVal(t, ['targetdate','datestr','tanggal']) }));
            const creatorReports = rawCreatorReports.map(r => ({ name: getVal(r, ['name','nama']), task: getVal(r, ['task','report','laporan']), rawDate: getVal(r, ['dateval','datestr','timestamp','tanggal']) }));
            const tasksDesain = rawTasks.map(t => ({ id: getVal(t, ['id']), assignee: getVal(t, ['assignee','nama']), status: getVal(t, ['status']), joCode: getVal(t, ['jocode']), title: getVal(t, ['title','projectname']), dateStr: getVal(t, ['datestr','timestamp']), priority: getVal(t, ['priority']) }));
            const tasks3d = rawTasks3d.map(t => ({
                id: getVal(t, ['id']), assignee: getVal(t, ['assignee','nama']), projectName: getVal(t, ['projectname','title']), status: getVal(t, ['status']), priority: getVal(t, ['priority']),
                startTime: getVal(t, ['starttime','waktumulai']), endTime: getVal(t, ['endtime','waktuselesai']), gramasi: getVal(t, ['gramasi']), jumlah: getVal(t, ['jumlah','qty']),
                mesin: getVal(t, ['mesin']), catatanTim: getVal(t, ['catatantim']), catatanAdmin: getVal(t, ['catatanadmin'])
            }));

            // 1. DIVISI KONTEN
            creatorTasks.reverse(); creatorTasks.sort((a,b) => (parseInt(b.id) || 0) - (parseInt(a.id) || 0));
            document.getElementById('creatorTaskCount').innerText = creatorTasks.length;
            
            if(creatorTasks.length === 0) {
                document.getElementById('creatorTasksContainer').innerHTML = `<p class="text-xs text-slate-400 text-center mt-10">Tidak ada tugas kreator</p>`;
            } else {
                document.getElementById('creatorTasksContainer').innerHTML = creatorTasks.map(c => `
                    <div class="p-3 bg-slate-50 dark:bg-zinc-900 border-l-[3px] border-l-blue-500 border border-slate-200 dark:border-zinc-800 rounded-xl">
                        <p class="text-[13px] font-semibold text-slate-800 dark:text-zinc-100 line-clamp-2 leading-snug">${c.title || 'Tanpa Judul'}</p>
                        <div class="flex items-center justify-between mt-2.5">
                            <span class="text-[10px] text-slate-500 dark:text-zinc-400 font-semibold bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="ph-bold ph-user"></i>${c.client || '-'}</span>
                            <span class="text-[10px] text-blue-600 dark:text-blue-400 font-mono font-bold flex items-center gap-1"><i class="ph-bold ph-clock"></i>${formatShortDate(c.targetDate)}</span>
                        </div>
                    </div>`).join('');
            }

            // LAPORAN KREATOR
            if(creatorReports.length === 0) {
                 document.getElementById('creatorReportsContainer').innerHTML = `<p class="text-xs text-slate-400 text-center mt-10">Belum ada laporan</p>`;
            } else {
                creatorReports.forEach(r => { r.parsedDateObj = parseToDateObj(r.rawDate); r.normalizedDate = getStandardDateString(r.rawDate); });
                creatorReports.sort((a, b) => { const dA = a.parsedDateObj.getTime(); const dB = b.parsedDateObj.getTime(); if (!isNaN(dA) && !isNaN(dB) && dA !== dB) return dB - dA; return 0; });
                
                const top2Dates = [...new Set(creatorReports.map(r => r.normalizedDate).filter(Boolean))].slice(0, 2);
                const filteredReports = creatorReports.filter(r => top2Dates.includes(r.normalizedDate));

                document.getElementById('creatorReportsContainer').innerHTML = filteredReports.map(r => `
                    <div class="p-3.5 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-2 opacity-[0.03] dark:opacity-5"><i class="ph-fill ph-quotes text-5xl text-slate-900 dark:text-white"></i></div>
                        <div class="flex items-center gap-2 mb-2 border-b border-slate-200 dark:border-zinc-800 pb-2">
                            <div class="h-6 w-6 rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30 flex items-center justify-center text-[11px] font-black">${String(r.name || 'U').charAt(0).toUpperCase()}</div>
                            <span class="text-[13px] font-extrabold text-slate-800 dark:text-zinc-100">${formatName(r.name)}</span>
                            <span class="text-[9px] text-slate-500 dark:text-zinc-400 font-mono ml-auto bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 px-1.5 py-0.5 rounded">${formatShortDate(r.parsedDateObj)}</span>
                        </div>
                        <div class="text-[11px] text-slate-600 dark:text-zinc-400 whitespace-pre-line leading-relaxed">${r.task || ''}</div>
                    </div>`).join('');
            }

            // 2. DIVISI DESAIN GRAFIS
            const teamMembers = ["Indah", "Nayla"]; const groupedTasks = {}; teamMembers.forEach(m => groupedTasks[m] = []);
            let uncompleted_tasks = tasksDesain.filter(t => t.assignee && !String(t.status).toLowerCase().includes('final'));
            uncompleted_tasks.reverse(); uncompleted_tasks.sort((a, b) => (parseInt(b.id) || 0) - (parseInt(a.id) || 0));

            uncompleted_tasks.forEach(task => {
                const name = formatName(task.assignee);
                if(groupedTasks[name] !== undefined) groupedTasks[name].push(task); else groupedTasks[name] = [task];
            });

            const colors = ['bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/20 dark:text-blue-400 dark:border-blue-500/30', 'bg-purple-50 text-purple-600 border-purple-200 dark:bg-purple-500/20 dark:text-purple-400 dark:border-purple-500/30'];
            let colorIndex = 0; let teamHtml = '';

            for(const [assignee, tasks] of Object.entries(groupedTasks)) {
                if(!teamMembers.includes(assignee) && tasks.length === 0) continue; 
                const avatarColor = colors[colorIndex % colors.length]; colorIndex++;

                teamHtml += `
                <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 shadow-sm flex flex-col h-[350px]">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                        <div class="flex items-center gap-2"><div class="h-7 w-7 rounded-full ${avatarColor} border flex items-center justify-center font-black text-[13px]">${assignee.charAt(0)}</div><h3 class="font-extrabold text-slate-800 dark:text-zinc-100 text-[14px]">${assignee}</h3></div>
                        <span class="${tasks.length > 0 ? 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-zinc-800 dark:text-zinc-300 dark:border-zinc-700' : 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20'} text-[10px] font-bold px-2 py-0.5 rounded border">${tasks.length} Task</span>
                    </div>
                    <div class="overflow-y-auto pr-1 flex-1">
                        ${tasks.length > 0 ? `<div class="space-y-2.5">` + tasks.map(t => `
                            <div class="p-2.5 border rounded-xl transition-all ${String(t.priority).toLowerCase() === 'urgent' ? 'bg-red-50 border-red-200 dark:bg-red-500/10 dark:border-red-500/30' : 'bg-slate-50 border-slate-200 dark:bg-zinc-900 dark:border-zinc-800'}">
                                <div class="flex justify-between items-start mb-1.5"><span class="text-[9px] font-bold text-slate-500 dark:text-zinc-400 bg-white border-slate-200 dark:bg-zinc-800 border dark:border-zinc-700 px-1.5 py-0.5 rounded">${t.joCode \vert{}\vert{} '-'}</span>${getStatusBadge(t.status)}</div>
                                <p class="text-[12px] font-semibold text-slate-800 dark:text-zinc-100 leading-snug mb-2">${t.title || 'Tanpa Judul'}</p>
                                <div class="flex justify-between items-center mt-1"><span class="text-[9px] text-slate-500 dark:text-zinc-500 font-semibold flex items-center gap-1"><i class="ph-bold ph-calendar-blank"></i> ${formatShortDate(t.dateStr)}</span>${getPriorityBadge(t.priority)}</div>
                            </div>`).join('') + `</div>` : `<div class="flex flex-col items-center justify-center h-full text-center pb-6 opacity-70"><i class="ph-fill ph-check-circle text-5xl text-emerald-500/70 mb-2 drop-shadow-sm"></i><p class="text-[13px] font-extrabold text-slate-700 dark:text-zinc-300">Semua Clear!</p></div>`}
                    </div>
                </div>`;
            }
            document.getElementById('teamTasksContainer').innerHTML = teamHtml;

            // 3. DIVISI 3D & PRODUKSI
            const teamMembers3d = ["Teguh", "Zalfa"]; const groupedTasks3d = {}; teamMembers3d.forEach(m => groupedTasks3d[m] = []);
            let uncompleted_tasks_3d = tasks3d.filter(t => t.assignee && !String(t.status).toLowerCase().includes('selesai'));
            uncompleted_tasks_3d.reverse(); uncompleted_tasks_3d.sort((a, b) => (parseInt(b.id) || 0) - (parseInt(a.id) || 0));

            uncompleted_tasks_3d.forEach(task => {
                const name = formatName(task.assignee);
                if(groupedTasks3d[name] !== undefined) groupedTasks3d[name].push(task); else groupedTasks3d[name] = [task];
            });

            const colors3d = ['bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/20 dark:text-emerald-400 dark:border-emerald-500/30', 'bg-teal-50 text-teal-600 border-teal-200 dark:bg-teal-500/20 dark:text-teal-400 dark:border-teal-500/30'];
            let colorIndex3d = 0; let teamHtml3d = '';

            for(const [assignee, tasks] of Object.entries(groupedTasks3d)) {
                if(!teamMembers3d.includes(assignee) && tasks.length === 0) continue; 
                const avatarColor = colors3d[colorIndex3d % colors3d.length]; colorIndex3d++;

                teamHtml3d += `
                <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 shadow-sm flex flex-col h-[350px]">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                        <div class="flex items-center gap-2"><div class="h-7 w-7 rounded-full ${avatarColor} border flex items-center justify-center font-black text-[13px]">${assignee.charAt(0)}</div><h3 class="font-extrabold text-slate-800 dark:text-zinc-100 text-[14px]">${assignee}</h3></div>
                        <span class="${tasks.length > 0 ? 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-zinc-800 dark:text-zinc-300 dark:border-zinc-700' : 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20'} text-[10px] font-bold px-2 py-0.5 rounded border">${tasks.length} Task</span>
                    </div>
                    
                    <div class="overflow-y-auto pr-1 flex-1">
                        ${tasks.length > 0 ? `<div class="space-y-2.5">` + tasks.map(t => {
                            let isUrgent = String(t.priority).toLowerCase() === 'urgent';
                            let urgentUI = isUrgent ? `<span class="urgent-blink bg-red-50 text-red-600 border-red-200 dark:bg-red-500/15 dark:text-red-400 border dark:border-red-500/30 uppercase"><i class="ph-fill ph-warning-circle"></i> Urgent</span>` : '';
                            
                            let statusUI = ''; let borderClass = 'bg-slate-50 border-slate-200 dark:bg-zinc-900 dark:border-zinc-800'; let detailsHTML = '';
                            let tStatus = String(t.status || 'Menunggu Respon');
                            let cStart = cleanTimeStr(t.startTime); let cEnd = cleanTimeStr(t.endTime);

                            if (tStatus === 'Menunggu Respon') {
                                statusUI = `<span class="text-[9px] font-bold text-blue-600 bg-blue-50 border border-blue-200 dark:bg-blue-500/20 dark:text-blue-400 dark:border-blue-500/30 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="ph-bold ph-clock-countdown"></i> Menunggu Respon</span>`;
                            } 
                            else if (tStatus === 'Lagi Dikerjain' || tStatus === 'Nunggu Revisi') {
                                borderClass = 'bg-purple-50/50 border-purple-200 dark:bg-purple-900/10 dark:border-purple-800/50';
                                statusUI = `<span class="text-[9px] font-extrabold text-purple-700 bg-purple-100 border border-purple-200 dark:bg-purple-500/20 dark:text-purple-400 dark:border-purple-500/30 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="ph-bold ${tStatus === 'Lagi Dikerjain' ? 'ph-pen-nib' : 'ph-arrows-clockwise'}"></i> ${tStatus}</span>`;
                                if((cStart && cStart !== '-') || (t.catatanTim && t.catatanTim !== '-')) {
                                    detailsHTML = `<div class="mt-2 text-[10px] md:text-[11px] font-medium text-slate-600 dark:text-zinc-400 bg-white dark:bg-zinc-950 p-2 rounded-lg border border-slate-100 dark:border-zinc-800 space-y-1">
                                        ${(cStart && cStart !== '-') ? `<div class="flex"><span class="font-bold text-slate-400 dark:text-zinc-500 w-12">Waktu</span> <span class="mr-1.5">:</span> ${cStart} - ${cEnd}</div>` : ''}
                                        ${(t.catatanTim && t.catatanTim !== '-') ? `<div class="pt-1 mt-1 border-t border-slate-100 dark:border-zinc-800 text-slate-500 dark:text-zinc-500 italic line-clamp-2">"${t.catatanTim}"</div>` : ''}
                                    </div>`;
                                }
                            }
                            else if (tStatus === 'Lagi Produksi') {
                                borderClass = 'bg-amber-50/50 border-amber-200 dark:bg-amber-900/10 dark:border-amber-800/50';
                                statusUI = `<span class="text-[9px] font-extrabold text-amber-700 bg-amber-100 border border-amber-200 dark:bg-amber-500/20 dark:text-amber-400 dark:border-amber-500/30 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="ph-fill ph-gear-six animate-spin-slow"></i> Lagi Produksi</span>`;
                                detailsHTML = `<div class="mt-2 text-[10px] md:text-[11px] font-medium text-slate-600 dark:text-zinc-400 bg-white dark:bg-zinc-950 p-2 rounded-lg border border-slate-100 dark:border-zinc-800 space-y-1">
                                    <div class="flex"><span class="font-bold text-slate-400 dark:text-zinc-500 w-14">Waktu</span> <span class="mr-1.5">:</span> ${cStart} -${cEnd}</div>
                                    <div class="flex"><span class="font-bold text-slate-400 dark:text-zinc-500 w-14">Gramasi</span> <span class="mr-1.5">:</span> ${t.gramasi || '-'}</div>
                                    <div class="flex"><span class="font-bold text-slate-400 dark:text-zinc-500 w-14">Jumlah</span> <span class="mr-1.5">:</span> ${t.jumlah || '-'}</div>
                                    <div class="flex"><span class="font-bold text-slate-400 dark:text-zinc-500 w-14">Mesin</span> <span class="mr-1.5">:</span> <span class="font-bold text-emerald-600 dark:text-emerald-400">${t.mesin \vert{}\vert{} '-'}</span></div>${t.catatanTim && t.catatanTim !== '-' ? `<div class="pt-1 mt-1 border-t border-slate-100 dark:border-zinc-800 text-slate-500 dark:text-zinc-500 italic line-clamp-2">"${t.catatanTim}"</div>` : ''}
                                </div>`;
                            }

                            return `<div class="p-3 border rounded-xl transition-all ${isUrgent ? 'bg-red-50 border-red-200 dark:bg-red-500/10 dark:border-red-500/30' : borderClass}">
                                <div class="flex flex-wrap justify-between items-start gap-1 mb-1.5">${statusUI}${urgentUI}</div>
                                <p class="text-[12px] md:text-[13px] font-bold text-slate-800 dark:text-zinc-100 leading-snug mb-1">${t.projectName \vert{}\vert{} 'Tanpa Judul'}</p>${t.catatanAdmin && t.catatanAdmin !== '-' ? `<p class="text-[10px] text-slate-500 dark:text-zinc-500 italic line-clamp-1 border-l-2 border-slate-300 dark:border-zinc-700 pl-1.5">Admin: "${t.catatanAdmin}"</p>` : ''}
                                ${detailsHTML}
                            </div>`;
                        }).join('') + `</div>` : `<div class="flex flex-col items-center justify-center h-full text-center pb-6 opacity-70"><i class="ph-fill ph-check-circle text-5xl text-emerald-500/70 mb-2 drop-shadow-sm"></i><p class="text-[13px] font-extrabold text-slate-700 dark:text-zinc-300">Semua Clear!</p></div>`}
                    </div>
                </div>`;
            }
            document.getElementById('teamTasks3dContainer').innerHTML = teamHtml3d;

            loadingIndicator.classList.add('hidden');
            statusDot.classList.replace('bg-amber-500', 'bg-emerald-500');
            renderChart();

        } catch (fatalError) {
            console.error("FATAL ERROR BOMB-PROOF:", fatalError);
            alert("Terjadi kesalahan saat memuat data. Mohon muat ulang halaman.");
        }
    }

    let productivityChart;
    function renderChart() {
        const ctx = document.getElementById('productivityChart').getContext('2d');
        if(productivityChart) productivityChart.destroy();
        productivityChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ["2 Sep", "3 Sep", "4 Sep", "7 Sep", "8 Sep", "9 Sep", "10 Sep", "11 Sep", "12 Sep"],
                datasets: [
                    { label: 'Desain', data: [1, 5, 2, 6, 2, 5, 5, 2, 3], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 2.5, tension: 0.4, fill: true, pointBackgroundColor: '#ffffff', pointBorderColor: '#3b82f6', pointBorderWidth: 2, pointRadius: 3.5 },
                    { label: 'Konten', data: [0, 0, 0, 0, 0, 0, 0, 0, 4], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', borderWidth: 2.5, tension: 0.4, fill: true, pointBackgroundColor: '#ffffff', pointBorderColor: '#10b981', pointBorderWidth: 2, pointRadius: 3.5 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'top', align: 'end', labels: { boxWidth: 8, usePointStyle: true, color: '#334155', font: { weight: '600' } } }, tooltip: { backgroundColor: '#0f172a', borderColor: '#334155', borderWidth: 1, titleColor: '#f8fafc', bodyColor: '#cbd5e1', padding: 8, cornerRadius: 8 } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9', drawBorder: false }, border: { dash: [4, 4] } }, x: { grid: { display: false, drawBorder: false } } } }
        });
        updateChartTheme();
    }

    const htmlTag = document.documentElement;
    let isDark = false; 

    function updateChartTheme() {
        if(!productivityChart) return;
        productivityChart.options.plugins.legend.labels.color = isDark ? '#e2e8f0' : '#334155';
        productivityChart.options.scales.y.grid.color = isDark ? '#27272a' : '#f1f5f9';
        productivityChart.data.datasets[0].pointBackgroundColor = isDark ? '#09090b' : '#ffffff';
        productivityChart.data.datasets[1].pointBackgroundColor = isDark ? '#09090b' : '#ffffff';
        productivityChart.update();
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
        isDark = !isDark;
        if(isDark) { htmlTag.classList.add('dark'); document.getElementById('themeIcon').className = 'ph-bold ph-sun text-lg'; } 
        else { htmlTag.classList.remove('dark'); document.getElementById('themeIcon').className = 'ph-bold ph-moon text-lg'; }
        updateChartTheme();
    });

    initDashboard();
</script>
</body>
</html>
