<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Molusca | App UI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class', // Mengaktifkan toggle dark mode via class
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        /* Transisi halus saat ganti tema */
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Custom Scrollbar Minimalis */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }

        /* Badge Status */
        .badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.02em;
        }
        
        /* Animasi Kedip Urgent */
        @keyframes urgent-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }
        .urgent-blink {
            animation: urgent-pulse 1.5s ease-in-out infinite;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        
        /* Header Section Divider dengan Spacing Lebar */
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 4rem 0 1.5rem 0; /* Space yang lega di atas judul */
        }
        .section-header::after {
            content: "";
            flex: 1;
            height: 1px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-zinc-950 dark:text-zinc-100 pb-16 text-[13px]"> 

<div class="max-w-[1200px] mx-auto p-4 md:p-6 lg:p-8 space-y-6">
    
    <!-- Header Web -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 md:mb-10 mt-2">
        <div>
            <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                <i class="ph-fill ph-rocket text-blue-500"></i> Molusca App
            </h1>
            <p class="text-[11px] md:text-xs text-slate-500 dark:text-zinc-400 mt-1 font-medium">Overview Operasional Tim Kreatif & Desain.</p>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- Waktu / Tanggal -->
            <div class="flex items-center gap-2 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 px-3 py-1.5 rounded-full text-[11px] shadow-sm font-semibold transition-colors">
                <span class="flex h-2 w-2 rounded-full bg-emerald-500 shadow-sm animate-pulse"></span>
                <span class="text-slate-700 dark:text-zinc-200" id="currentDate">--</span>
            </div>
            
            <!-- Tombol Dark/Light Mode -->
            <button id="themeToggle" class="flex items-center justify-center h-8 w-8 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-full shadow-sm text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                <i id="themeIcon" class="ph-bold ph-moon text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Chart / Grafik Global -->
    <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col mb-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-[14px] font-bold flex items-center gap-2 text-slate-800 dark:text-zinc-100"><i class="ph-bold ph-trend-up text-blue-500"></i> Produktivitas Global</h2>
        </div>
        <div class="relative w-full h-[180px] md:h-[220px]">
            <canvas id="productivityChart"></canvas>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- BAGIAN 1: DIVISI KONTEN -->
    <!-- ============================================== -->
    <div class="section-header after:bg-slate-200 dark:after:bg-zinc-800">
        <h2 class="text-base md:text-lg font-black text-slate-900 dark:text-white tracking-wide uppercase flex items-center gap-2">
            <i class="ph-fill ph-video-camera text-rose-500"></i> Divisi Konten
        </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
        <!-- 1. Target Deadline Kreator -->
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col h-[320px]">
            <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                <h3 class="text-[13px] font-bold flex items-center gap-1.5 text-slate-800 dark:text-zinc-100"><i class="ph-bold ph-calendar-blank text-blue-500"></i> Target Deadline</h3>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="creatorTasksContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>

        <!-- 2. Laporan Harian Kreator -->
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col h-[320px]">
            <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                <h3 class="text-[13px] font-bold flex items-center gap-1.5 text-slate-800 dark:text-zinc-100"><i class="ph-bold ph-files text-emerald-500"></i> Laporan (2 Hari)</h3>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="creatorReportsContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>
    </div>


    <!-- ============================================== -->
    <!-- BAGIAN 2: DIVISI DESAIN -->
    <!-- ============================================== -->
    <div class="section-header after:bg-slate-200 dark:after:bg-zinc-800">
        <h2 class="text-base md:text-lg font-black text-slate-900 dark:text-white tracking-wide uppercase flex items-center gap-2">
            <i class="ph-fill ph-paint-brush-broad text-purple-500"></i> Divisi Desain
        </h2>
    </div>

    <div>
        <div class="flex items-center justify-between mb-4">
            <p class="text-[11px] md:text-xs text-slate-500 dark:text-zinc-400 font-medium bg-slate-100 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 px-3 py-1.5 rounded-lg inline-flex items-center gap-2">
                <i class="ph-fill ph-info text-blue-500"></i> Menampilkan task berjalan / belum selesai
            </p>
        </div>
        
        <!-- Grid Wadah Tim (Kolom per orang) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6" id="teamTasksContainer">
            <!-- Data di-inject JS -->
        </div>
    </div>

</div>

<script>
    // Set Tanggal
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', options);

    // ==========================================
    // DATA MASTER
    // ==========================================
    const data = {
        creator_tasks: [
            {"title": "Projek Internal Content", "client": "Internal", "targetDate": "2026-06-20"}, 
            {"title": "1. Tugu Insurance - Miniatur 3d", "client": "sania", "targetDate": "2026-09-12"}, 
            {"title": "wa 892 - 190 pcs gantungan & 200 notebook", "client": "sania", "targetDate": "2026-09-12"}
        ],
        recent_reports: [
            {"name": "Elfrida", "dateStr": "12-09-2026", "task": "• Edit konten & story hampers InJourney\n• Take konten TikTok\n• Take video hampers PLN"}, 
            {"name": "Esa", "dateStr": "12-09-2026", "task": "• Take tumbler pertamina\n• Take konten tiktok\n• Edit revisi bookmark hmns\n• Edit konten vo pertamina"}
        ],
        uncompleted_tasks: [
            {"joCode": "EXTRA", "title": "DADAN CATEXTILE", "assignee": "Nayla", "dateStr": "2026-09-12", "status": "Nunggu Revisi", "priority": "urgent"},
            {"joCode": "EXTRA", "title": "DADAN TUGU INSURANCE", "assignee": "Nayla", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN NICHI NICHI", "assignee": "Indah", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "DADAN BLIND BOX PLN", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI TAS BATIK", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "Hani Labschool", "assignee": "Indah", "dateStr": "2026-09-09", "status": "Lagi Dikerjain", "priority": "urgent"}, 
            {"joCode": "EXTRA", "title": "HANI AMAZON", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI POLLY POCKER", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PELITA", "assignee": "Indah", "dateStr": "2026-09-03", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN STICKER NAMA", "assignee": "Indah", "dateStr": "2026-08-29", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN HULU MIGAS", "assignee": "Indah", "dateStr": "2026-08-27", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN SATYA JKN", "assignee": "Indah", "dateStr": "2026-08-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI WM", "assignee": "Nayla", "dateStr": "2026-08-18", "status": "Tinggal Layout", "priority": "normal"},
            {"joCode": "JO KAK TANIA", "title": "injourney", "assignee": "Nayla", "dateStr": "2026-08-10", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI NOVO NORDISK", "assignee": "Indah", "dateStr": "2026-07-29", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PLN JABARDI", "assignee": "Indah", "dateStr": "2026-07-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "DADAN FLUFFY LAB", "assignee": "Nayla", "dateStr": "2026-07-22", "status": "Nunggu Revisi", "priority": "normal"}
        ]
    };

    // ==========================================
    // UTILS
    // ==========================================
    function getStatusBadge(status) {
        const s = status.toLowerCase();
        if (s.includes('final')) return `<span class="badge bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-400 border dark:border-emerald-500/30">Final</span>`;
        if (s.includes('revisi') || s.includes('to-do')) return `<span class="badge bg-amber-50 text-amber-600 border-amber-200 dark:bg-amber-500/15 dark:text-amber-400 border dark:border-amber-500/30">${status}</span>`;
        return `<span class="badge bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/15 dark:text-blue-400 border dark:border-blue-500/30">${status}</span>`;
    }

    function getPriorityBadge(priority) {
        if ((priority || "").toLowerCase() === 'urgent') {
            return `<span class="urgent-blink bg-red-50 text-red-600 border-red-200 dark:bg-red-500/15 dark:text-red-400 border dark:border-red-500/30 uppercase"><i class="ph-fill ph-warning-circle"></i> Urgent</span>`;
        }
        return ``;
    }
    
    function formatShortDate(dateStr) {
        if(!dateStr) return "";
        const parts = dateStr.split('-');
        if(parts.length === 3) {
            const date = new Date(parts[0], parts[1]-1, parts[2]);
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        }
        return dateStr;
    }

    // ==========================================
    // RENDER: DIVISI KONTEN
    // ==========================================
    const cTaskHtml = data.creator_tasks.map(c => `
        <div class="p-3 bg-slate-50 dark:bg-zinc-900 border-l-[3px] border-l-blue-500 border border-slate-200 dark:border-zinc-800 rounded-xl">
            <p class="text-[13px] font-semibold text-slate-800 dark:text-zinc-100 line-clamp-2 leading-snug">${c.title}</p>
            <div class="flex items-center justify-between mt-2.5">
                <span class="text-[10px] text-slate-500 dark:text-zinc-400 font-semibold bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="ph-bold ph-user"></i>${c.client}</span>
                <span class="text-[10px] text-blue-600 dark:text-blue-400 font-mono font-bold flex items-center gap-1"><i class="ph-bold ph-clock"></i>${formatShortDate(c.targetDate)}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('creatorTasksContainer').innerHTML = cTaskHtml;

    const cReportHtml = data.recent_reports.map(r => `
        <div class="p-3.5 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 p-2 opacity-[0.03] dark:opacity-5"><i class="ph-fill ph-quotes text-5xl text-slate-900 dark:text-white"></i></div>
            <div class="flex items-center gap-2 mb-2 border-b border-slate-200 dark:border-zinc-800 pb-2">
                <div class="h-6 w-6 rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30 flex items-center justify-center text-[11px] font-black">${r.name.charAt(0)}</div>
                <span class="text-[13px] font-extrabold text-slate-800 dark:text-zinc-100">${r.name}</span>
                <span class="text-[9px] text-slate-500 dark:text-zinc-400 font-mono ml-auto bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 px-1.5 py-0.5 rounded">${r.dateStr}</span>
            </div>
            <div class="text-[11px] text-slate-600 dark:text-zinc-400 whitespace-pre-line leading-relaxed">${r.task}</div>
        </div>
    `).join('');
    document.getElementById('creatorReportsContainer').innerHTML = cReportHtml;

    // ==========================================
    // RENDER: DIVISI DESAIN (TEAM GRID)
    // ==========================================
    const teamMembers = ["Indah", "Nayla"];
    const groupedTasks = {};
    
    teamMembers.forEach(m => groupedTasks[m] = []);
    data.uncompleted_tasks.forEach(task => {
        const name = task.assignee.charAt(0).toUpperCase() + task.assignee.slice(1).toLowerCase();
        if(groupedTasks[name] !== undefined) { groupedTasks[name].push(task); } 
        else { groupedTasks[name] = [task]; }
    });

    const teamContainer = document.getElementById('teamTasksContainer');
    let teamHtml = '';

    const colors = [
        'bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/20 dark:text-blue-400 dark:border-blue-500/30', 
        'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/20 dark:text-emerald-400 dark:border-emerald-500/30', 
        'bg-purple-50 text-purple-600 border-purple-200 dark:bg-purple-500/20 dark:text-purple-400 dark:border-purple-500/30', 
        'bg-orange-50 text-orange-600 border-orange-200 dark:bg-orange-500/20 dark:text-orange-400 dark:border-orange-500/30'
    ];
    let colorIndex = 0;

    for(const [assignee, tasks] of Object.entries(groupedTasks)) {
        const avatarColor = colors[colorIndex % colors.length];
        colorIndex++;

        teamHtml += `
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-4 shadow-sm flex flex-col h-[350px]">
            <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                <div class="flex items-center gap-2">
                    <div class="h-7 w-7 rounded-full ${avatarColor} border flex items-center justify-center font-black text-[13px]">
                        ${assignee.charAt(0)}
                    </div>
                    <h3 class="font-extrabold text-slate-800 dark:text-zinc-100 text-[14px]">${assignee}</h3>
                </div>
                <span class="${tasks.length > 0 ? 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-zinc-800 dark:text-zinc-300 dark:border-zinc-700' : 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20'} text-[10px] font-bold px-2 py-0.5 rounded border">${tasks.length} Task</span>
            </div>
            
            <div class="overflow-y-auto pr-1 flex-1">
                ${tasks.length > 0 ? `<div class="space-y-2.5">` + tasks.map(t => `
                    <div class="p-2.5 border rounded-xl transition-all ${t.priority?.toLowerCase() === 'urgent' ? 'bg-red-50 border-red-200 dark:bg-red-500/10 dark:border-red-500/30' : 'bg-slate-50 border-slate-200 dark:bg-zinc-900 dark:border-zinc-800'}">
                        <div class="flex justify-between items-start mb-1.5">
                            <span class="text-[9px] font-bold text-slate-500 dark:text-zinc-400 bg-white border-slate-200 dark:bg-zinc-800 border dark:border-zinc-700 px-1.5 py-0.5 rounded">${t.joCode}</span>
                            ${getStatusBadge(t.status)}
                        </div>
                        <p class="text-[12px] font-semibold text-slate-800 dark:text-zinc-100 leading-snug mb-2">${t.title}</p>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[9px] text-slate-500 dark:text-zinc-500 font-semibold flex items-center gap-1"><i class="ph-bold ph-calendar-blank"></i> ${formatShortDate(t.dateStr)}</span>
                            ${getPriorityBadge(t.priority)}
                        </div>
                    </div>
                `).join('') + `</div>` : `
                    <!-- EMPTY STATE JIKA TASK 0 -->
                    <div class="flex flex-col items-center justify-center h-full text-center pb-6 opacity-70">
                        <i class="ph-fill ph-check-circle text-5xl text-emerald-500/70 mb-2 drop-shadow-sm"></i>
                        <p class="text-[13px] font-extrabold text-slate-700 dark:text-zinc-300">Semua Clear!</p>
                        <p class="text-[11px] font-medium text-slate-500 dark:text-zinc-500 mt-0.5">Kerjaan sudah beres.</p>
                    </div>
                `}
            </div>
        </div>
        `;
    }
    teamContainer.innerHTML = teamHtml;

    // ==========================================
    // DARK MODE TOGGLE & CHART INIT
    // ==========================================
    const htmlTag = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    let isDark = false; // Default Light Mode

    // Inisialisasi Chart
    const ctx = document.getElementById('productivityChart').getContext('2d');
    const chartLabels = ["2 Sep", "3 Sep", "4 Sep", "7 Sep", "8 Sep", "9 Sep", "10 Sep", "11 Sep", "12 Sep"];
    
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.font.size = 11;

    let productivityChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartLabels,
            datasets: [
                {
                    label: 'Desain',
                    data: [1, 5, 2, 6, 2, 5, 5, 2, 3],
                    borderColor: '#3b82f6', 
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2.5,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#3b82f6',
                    pointBorderWidth: 2,
                    pointRadius: 3.5
                },
                {
                    label: 'Konten',
                    data: [0, 0, 0, 0, 0, 0, 0, 0, 4],
                    borderColor: '#10b981',  
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderWidth: 2.5,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#10b981',
                    pointBorderWidth: 2,
                    pointRadius: 3.5
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', align: 'end', labels: { boxWidth: 8, usePointStyle: true, color: '#334155', font: { weight: '600' } } },
                tooltip: { backgroundColor: '#0f172a', borderColor: '#334155', borderWidth: 1, titleColor: '#f8fafc', bodyColor: '#cbd5e1', padding: 8, cornerRadius: 8 }
            },
            scales: {
                y: { beginAtZero: true, grid: { color: '#f1f5f9', drawBorder: false }, border: { dash: [4, 4] } },
                x: { grid: { display: false, drawBorder: false } }
            }
        }
    });

    function updateChartTheme() {
        // Update warna chart mengikuti tema
        const textColor = isDark ? '#e2e8f0' : '#334155';
        const gridColor = isDark ? '#27272a' : '#f1f5f9';
        const pointBg = isDark ? '#09090b' : '#ffffff';

        productivityChart.options.plugins.legend.labels.color = textColor;
        productivityChart.options.scales.y.grid.color = gridColor;
        productivityChart.data.datasets[0].pointBackgroundColor = pointBg;
        productivityChart.data.datasets[1].pointBackgroundColor = pointBg;
        productivityChart.update();
    }

    // Listener Tombol Toggle
    themeToggleBtn.addEventListener('click', () => {
        isDark = !isDark;
        if(isDark) {
            htmlTag.classList.add('dark');
            themeIcon.classList.remove('ph-moon');
            themeIcon.classList.add('ph-sun');
        } else {
            htmlTag.classList.remove('dark');
            themeIcon.classList.remove('ph-sun');
            themeIcon.classList.add('ph-moon');
        }
        updateChartTheme();
    });

</script>
</body>
</html>
