<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Molusca | App UI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#09090b', // Hitam pekat modern
                        surface: '#18181b',    // Abu-abu gelap (zinc-900)
                        border: '#27272a',     // Border tipis (zinc-800)
                        primary: '#f4f4f5',    // Putih text utama (zinc-100)
                        muted: '#a1a1aa'       // Abu-abu text sekunder (zinc-400)
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { 
            background-color: #09090b; 
            color: #f4f4f5; 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom Scrollbar Minimalis Dark */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px; /* Lebih melengkung ala aplikasi iOS */
            padding: 1.25rem;
        }
        
        /* Badge Status */
        .badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.02em;
        }
        .badge-final { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-process { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
        
        /* Animasi Kedip untuk Task Urgent (Dark Mode) */
        @keyframes urgent-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }
        .urgent-blink {
            animation: urgent-pulse 1.5s ease-in-out infinite;
            background-color: rgba(239, 68, 68, 0.15); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        
        /* Header Section Divider dengan Spacing Lebar */
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 4rem 0 1.5rem 0; /* Space yang sangat lega di atas judul */
        }
        .section-header::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #27272a;
        }
    </style>
</head>
<body class="selection:bg-zinc-800 pb-16 text-[13px]"> <!-- Base font diturunkan -->

<div class="max-w-[1200px] mx-auto p-4 md:p-6 lg:p-8 space-y-6">
    
    <!-- Header Web -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 md:mb-10 mt-2">
        <div>
            <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                <i class="ph-fill ph-rocket text-blue-500"></i> Molusca App
            </h1>
            <p class="text-[11px] md:text-xs text-muted mt-1 font-medium">Overview Operasional Tim Kreatif & Desain.</p>
        </div>
        <div class="flex items-center gap-2 bg-surface border border-border px-3 py-1.5 rounded-full text-[11px] shadow-sm font-semibold">
            <span class="flex h-2 w-2 rounded-full bg-emerald-500 shadow-sm animate-pulse"></span>
            <span class="text-primary" id="currentDate">--</span>
        </div>
    </header>

    <!-- Chart / Grafik Global -->
    <div class="card flex flex-col mb-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-[14px] font-bold flex items-center gap-2 text-primary"><i class="ph-bold ph-trend-up text-blue-400"></i> Produktivitas Global</h2>
        </div>
        <div class="relative w-full h-[180px] md:h-[220px]">
            <canvas id="productivityChart"></canvas>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- BAGIAN 1: DIVISI KONTEN -->
    <!-- ============================================== -->
    <div class="section-header">
        <h2 class="text-base md:text-lg font-black text-white tracking-wide uppercase flex items-center gap-2">
            <i class="ph-fill ph-video-camera text-rose-500"></i> Divisi Konten
        </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
        <!-- 1. Jobdesk (To-Do) -->
        <div class="card flex flex-col h-[320px]">
            <div class="flex items-center justify-between mb-3 border-b border-border pb-3">
                <h3 class="text-[13px] font-bold flex items-center gap-1.5 text-primary"><i class="ph-bold ph-check-square text-orange-400"></i> List Jobdesk</h3>
                <span class="text-[10px] bg-orange-500/10 text-orange-400 font-bold px-2 py-0.5 rounded border border-orange-500/20" id="jobdeskCount">0</span>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="jobdeskContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>

        <!-- 2. Target Deadline Kreator -->
        <div class="card flex flex-col h-[320px]">
            <div class="flex items-center justify-between mb-3 border-b border-border pb-3">
                <h3 class="text-[13px] font-bold flex items-center gap-1.5 text-primary"><i class="ph-bold ph-calendar-blank text-blue-400"></i> Target Deadline</h3>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="creatorTasksContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>

        <!-- 3. Laporan Harian Kreator -->
        <div class="card flex flex-col h-[320px]">
            <div class="flex items-center justify-between mb-3 border-b border-border pb-3">
                <h3 class="text-[13px] font-bold flex items-center gap-1.5 text-primary"><i class="ph-bold ph-files text-emerald-400"></i> Laporan (2 Hari)</h3>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="creatorReportsContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>
    </div>


    <!-- ============================================== -->
    <!-- BAGIAN 2: DIVISI DESAIN -->
    <!-- ============================================== -->
    <div class="section-header">
        <h2 class="text-base md:text-lg font-black text-white tracking-wide uppercase flex items-center gap-2">
            <i class="ph-fill ph-paint-brush-broad text-purple-500"></i> Divisi Desain
        </h2>
    </div>

    <div>
        <div class="flex items-center justify-between mb-4">
            <p class="text-[11px] md:text-xs text-muted font-medium bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg inline-flex items-center gap-2">
                <i class="ph-fill ph-info text-blue-400"></i> Menampilkan task berjalan / belum selesai
            </p>
        </div>
        
        <!-- Grid Wadah Tim (Kolom per orang) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6" id="teamTasksContainer">
            <!-- Data di-inject JS -->
        </div>
    </div>

</div>

<script>
    // Set Tanggal Hari Ini dengan format ringkas (Misal: 14 Sep 2026)
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', options);

    // ==========================================
    // DATA MASTER
    // ==========================================
    const data = {
        // Data Konten - Jobdesk
        jobdesk: [
            {"id": 1, "title": "Memastikan barang sudah di take semua", "pic": "Esa", "desc": "Tidak ada futech tertinggal"}, 
            {"id": 2, "title": "Menanyakan jadwal prodak", "pic": "Nazma", "desc": "Tanya jadwal hari ini ke admin"}, 
            {"id": 3, "title": "Memastikan barang sudah ada", "pic": "El", "desc": "Prodak siap untuk di-content"}
        ],
        // Data Konten - Tasks & Deadline
        creator_tasks: [
            {"title": "Projek Internal Content", "client": "Internal", "targetDate": "2026-06-20"}, 
            {"title": "1. Tugu Insurance - Miniatur 3d", "client": "sania", "targetDate": "2026-09-12"}, 
            {"title": "wa 892 - 190 pcs gantungan & 200 notebook", "client": "sania", "targetDate": "2026-09-12"}
        ],
        // Data Konten - Laporan
        recent_reports: [
            {"name": "Elfrida", "dateStr": "12-09-2026", "task": "• Edit konten & story hampers InJourney\n• Take konten TikTok\n• Take video hampers PLN"}, 
            {"name": "Esa", "dateStr": "12-09-2026", "task": "• Take tumbler pertamina\n• Take konten tiktok\n• Edit revisi bookmark hmns\n• Edit konten vo pertamina"}
        ],
        
        // Data Desain - Task Belum Selesai (Termasuk yang Urgent)
        uncompleted_tasks: [
            {"joCode": "EXTRA", "title": "DADAN CATEXTILE", "assignee": "Nayla", "dateStr": "2026-09-12", "status": "Nunggu Revisi", "priority": "urgent"},
            {"joCode": "EXTRA", "title": "DADAN TUGU INSURANCE", "assignee": "Nayla", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN NICHI NICHI", "assignee": "Indah", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "DADAN BLIND BOX PLN", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI TAS BATIK", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "Hani Labschool", "assignee": "Indah", "dateStr": "2026-09-09", "status": "Lagi Dikerjain", "priority": "urgent"}, 
            {"joCode": "EXTRA", "title": "HANI AMAZON", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI POLLY POCKER", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PELITA", "assignee": "Indah", "dateStr": "2026-09-03", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN STICKER NAMA", "assignee": "Indah", "dateStr": "2026-08-29", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN HULU MIGAS", "assignee": "Indah", "dateStr": "2026-08-27", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN SATYA JKN", "assignee": "Indah", "dateStr": "2026-08-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI WM", "assignee": "Nayla", "dateStr": "2026-08-18", "status": "Tinggal Layout", "priority": "normal"},
            {"joCode": "JO KAK TANIA", "title": "injourney", "assignee": "Nayla", "dateStr": "2026-08-10", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI NOVO NORDISK", "assignee": "Indah", "dateStr": "2026-07-29", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PLN JABARDI", "assignee": "Indah", "dateStr": "2026-07-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "DADAN FLUFFY LAB", "assignee": "Nayla", "dateStr": "2026-07-22", "status": "Nunggu Revisi", "priority": "normal"}
        ]
    };

    // ==========================================
    // UTILS
    // ==========================================
    function getStatusBadge(status) {
        const s = status.toLowerCase();
        if (s.includes('final')) return `<span class="badge badge-final">Final</span>`;
        if (s.includes('revisi') || s.includes('to-do')) return `<span class="badge badge-pending">${status}</span>`;
        return `<span class="badge badge-process">${status}</span>`;
    }

    function getPriorityBadge(priority) {
        if ((priority || "").toLowerCase() === 'urgent') {
            return `<span class="urgent-blink uppercase"><i class="ph-fill ph-warning-circle"></i> Urgent</span>`;
        }
        return ``;
    }
    
    function formatShortDate(dateStr) {
        if(!dateStr) return "";
        const parts = dateStr.split('-');
        if(parts.length === 3) {
            const date = new Date(parts[0], parts[1]-1, parts[2]);
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        }
        return dateStr;
    }

    // ==========================================
    // RENDER: DIVISI KONTEN
    // ==========================================
    
    // 1. Jobdesk
    document.getElementById('jobdeskCount').innerText = data.jobdesk.length;
    const jobdeskHtml = data.jobdesk.map(item => `
        <div class="flex items-start gap-2.5 p-2.5 bg-zinc-900 border border-border rounded-xl">
            <div class="mt-0.5 text-blue-400"><i class="ph-fill ph-check-circle"></i></div>
            <div class="flex-1">
                <p class="text-[13px] text-primary font-semibold leading-snug">${item.title}</p>
                <p class="text-[11px] text-muted mt-0.5">${item.desc}</p>
            </div>
            <div class="bg-zinc-800 border border-zinc-700 px-1.5 py-0.5 rounded shrink-0">
                <span class="text-[10px] font-bold text-zinc-300">${item.pic}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('jobdeskContainer').innerHTML = jobdeskHtml;

    // 2. Creator Tasks (Deadline)
    const cTaskHtml = data.creator_tasks.map(c => `
        <div class="p-3 bg-zinc-900 border-l-[3px] border-l-blue-500 border border-border rounded-xl">
            <p class="text-[13px] font-semibold text-primary line-clamp-2 leading-snug">${c.title}</p>
            <div class="flex items-center justify-between mt-2.5">
                <span class="text-[10px] text-zinc-400 font-semibold bg-zinc-800 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="ph-bold ph-user"></i>${c.client}</span>
                <span class="text-[10px] text-blue-400 font-mono font-bold flex items-center gap-1"><i class="ph-bold ph-clock"></i>${formatShortDate(c.targetDate)}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('creatorTasksContainer').innerHTML = cTaskHtml;

    // 3. Creator Reports
    const cReportHtml = data.recent_reports.map(r => `
        <div class="p-3.5 bg-zinc-900 border border-border rounded-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 p-2 opacity-5"><i class="ph-fill ph-quotes text-5xl text-white"></i></div>
            <div class="flex items-center gap-2 mb-2 border-b border-border pb-2">
                <div class="h-6 w-6 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-[11px] font-black">${r.name.charAt(0)}</div>
                <span class="text-[13px] font-extrabold text-primary">${r.name}</span>
                <span class="text-[9px] text-muted font-mono ml-auto bg-zinc-800 border border-zinc-700 px-1.5 py-0.5 rounded">${r.dateStr}</span>
            </div>
            <div class="text-[11px] text-zinc-400 whitespace-pre-line leading-relaxed">${r.task}</div>
        </div>
    `).join('');
    document.getElementById('creatorReportsContainer').innerHTML = cReportHtml;


    // ==========================================
    // RENDER: DIVISI DESAIN (TEAM GRID)
    // ==========================================
    const teamMembers = ["Indah", "Nayla", "Tya", "Dadan"];
    const groupedTasks = {};
    
    // Inisialisasi awal (agar yang task 0 tetap muncul)
    teamMembers.forEach(m => groupedTasks[m] = []);

    // Masukkan data task
    data.uncompleted_tasks.forEach(task => {
        const name = task.assignee.charAt(0).toUpperCase() + task.assignee.slice(1).toLowerCase();
        if(groupedTasks[name] !== undefined) {
            groupedTasks[name].push(task);
        } else {
            groupedTasks[name] = [task];
        }
    });

    const teamContainer = document.getElementById('teamTasksContainer');
    let teamHtml = '';

    const colors = ['bg-blue-500/20 text-blue-400 border-blue-500/30', 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', 'bg-purple-500/20 text-purple-400 border-purple-500/30', 'bg-orange-500/20 text-orange-400 border-orange-500/30'];
    let colorIndex = 0;

    for(const [assignee, tasks] of Object.entries(groupedTasks)) {
        const avatarColor = colors[colorIndex % colors.length];
        colorIndex++;

        teamHtml += `
        <div class="card flex flex-col h-[350px]">
            <div class="flex items-center justify-between mb-3 border-b border-border pb-3">
                <div class="flex items-center gap-2">
                    <div class="h-7 w-7 rounded-full ${avatarColor} border flex items-center justify-center font-black text-[13px]">
                        ${assignee.charAt(0)}
                    </div>
                    <h3 class="font-extrabold text-primary text-[14px]">${assignee}</h3>
                </div>
                <span class="${tasks.length > 0 ? 'bg-zinc-800 text-zinc-300 border-zinc-700' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'} text-[10px] font-bold px-2 py-0.5 rounded border">${tasks.length} Task</span>
            </div>
            
            <div class="overflow-y-auto pr-1 flex-1">
                ${tasks.length > 0 ? `<div class="space-y-2.5">` + tasks.map(t => `
                    <div class="p-2.5 border rounded-xl transition-all ${t.priority?.toLowerCase() === 'urgent' ? 'bg-red-500/10 border-red-500/30' : 'bg-zinc-900 border-border'}">
                        <div class="flex justify-between items-start mb-1.5">
                            <span class="text-[9px] font-bold text-zinc-400 bg-zinc-800 px-1.5 py-0.5 rounded">${t.joCode}</span>
                            ${getStatusBadge(t.status)}
                        </div>
                        <p class="text-[12px] font-semibold text-primary leading-snug mb-2">${t.title}</p>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[9px] text-zinc-500 font-semibold flex items-center gap-1"><i class="ph-bold ph-calendar-blank"></i> ${formatShortDate(t.dateStr)}</span>
                            ${getPriorityBadge(t.priority)}
                        </div>
                    </div>
                `).join('') + `</div>` : `
                    <!-- EMPTY STATE JIKA TASK 0 -->
                    <div class="flex flex-col items-center justify-center h-full text-center pb-6 opacity-70">
                        <i class="ph-fill ph-check-circle text-5xl text-emerald-500/70 mb-2 drop-shadow-sm"></i>
                        <p class="text-[13px] font-extrabold text-zinc-300">Semua Clear!</p>
                        <p class="text-[11px] font-medium text-zinc-500 mt-0.5">Kerjaan sudah beres.</p>
                    </div>
                `}
            </div>
        </div>
        `;
    }
    teamContainer.innerHTML = teamHtml;


    // ==========================================
    // INIT CHART.JS (DARK THEME)
    // ==========================================
    const ctx = document.getElementById('productivityChart').getContext('2d');
    
    const chartLabels = ["2 Sep", "3 Sep", "4 Sep", "7 Sep", "8 Sep", "9 Sep", "10 Sep", "11 Sep", "12 Sep"];
    const designTrend = [1, 5, 2, 6, 2, 5, 5, 2, 3];
    const contentTrend = [0, 0, 0, 0, 0, 0, 0, 0, 4];

    Chart.defaults.color = '#a1a1aa'; 
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.font.size = 11;

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartLabels,
            datasets: [
                {
                    label: 'Desain',
                    data: designTrend,
                    borderColor: '#3b82f6', 
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2.5,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#09090b',
                    pointBorderColor: '#3b82f6',
                    pointBorderWidth: 2,
                    pointRadius: 3.5
                },
                {
                    label: 'Konten',
                    data: contentTrend,
                    borderColor: '#10b981',  
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderWidth: 2.5,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#09090b',
                    pointBorderColor: '#10b981',
                    pointBorderWidth: 2,
                    pointRadius: 3.5
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { 
                    position: 'top', 
                    align: 'end',
                    labels: { boxWidth: 8, usePointStyle: true, color: '#ededed', font: { weight: '600', size: 11 } } 
                },
                tooltip: { backgroundColor: '#18181b', borderColor: '#27272a', borderWidth: 1, titleColor: '#ededed', bodyColor: '#a1a1aa', padding: 8, cornerRadius: 8, titleFont: { size: 12 }, bodyFont: { size: 11 } }
            },
            scales: {
                y: { beginAtZero: true, grid: { color: '#27272a', drawBorder: false }, border: { dash: [4, 4] } },
                x: { grid: { display: false, drawBorder: false } }
            }
        }
    });
</script>
</body>
</html>
