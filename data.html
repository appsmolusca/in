<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Molusca | Team Workspace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#f8fafc', 
                        surface: '#ffffff',    
                        border: '#e2e8f0',     
                        primary: '#0f172a',    
                        muted: '#64748b'       
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar Minimalis */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        
        /* Badge Status */
        .badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.02em;
        }
        .badge-final { background: #d1fae5; color: #059669; border: 1px solid #a7f3d0; }
        .badge-pending { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        .badge-process { background: #dbeafe; color: #2563eb; border: 1px solid #bfdbfe; }
        
        /* Animasi Kedip untuk Task Urgent */
        @keyframes urgent-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }
        .urgent-blink {
            animation: urgent-pulse 1.2s ease-in-out infinite;
            background-color: #fee2e2; 
            color: #dc2626; 
            border: 1px solid #fca5a5;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-100 pb-10">

<div class="max-w-[1400px] mx-auto p-4 md:p-6 lg:p-8 space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-primary flex items-center gap-2">
                <i class="ph-fill ph-rocket text-blue-600"></i> Molusca Workspace
            </h1>
            <p class="text-sm text-muted mt-1 font-medium">Dashboard operasional tim desain & kreator.</p>
        </div>
        <div class="flex items-center gap-3 bg-white border border-border px-4 py-2.5 rounded-full text-sm shadow-sm font-semibold">
            <span class="flex h-2.5 w-2.5 rounded-full bg-emerald-500 shadow-sm animate-pulse"></span>
            <span class="text-primary" id="currentDate">Memuat tanggal...</span>
        </div>
    </header>

    <!-- Baris 1: Kurva & Jobdesk -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Chart -->
        <div class="card lg:col-span-2 flex flex-col">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-bold flex items-center gap-2 text-primary"><i class="ph-bold ph-trend-up text-blue-500"></i> Produktivitas Project</h2>
            </div>
            <div class="relative flex-1 min-h-[250px] w-full">
                <canvas id="productivityChart"></canvas>
            </div>
        </div>

        <!-- Jobdesk (To-Do) -->
        <div class="card flex flex-col">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                <h2 class="text-lg font-bold flex items-center gap-2 text-primary"><i class="ph-bold ph-check-square text-orange-500"></i> Jobdesk (To-Do)</h2>
                <span class="text-xs bg-orange-100 text-orange-700 font-bold px-2.5 py-1 rounded-md" id="jobdeskCount">0</span>
            </div>
            <div class="space-y-3 overflow-y-auto max-h-[230px] pr-2" id="jobdeskContainer">
                <!-- Data di-inject JS -->
            </div>
        </div>
    </div>

    <!-- Baris 2: Task per Desainer -->
    <div>
        <div class="flex items-center justify-between mb-4 mt-6">
            <h2 class="text-xl font-extrabold flex items-center gap-2 text-primary">
                <i class="ph-fill ph-users-three text-purple-600"></i> Beban Kerja Tim Desain
            </h2>
            <div class="text-xs text-purple-700 bg-purple-50 font-bold border border-purple-200 px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5">
                <span class="flex h-2 w-2 rounded-full bg-purple-500 animate-pulse"></span> Filter: Belum Selesai
            </div>
        </div>
        
        <!-- Grid Wadah Tim (Kolom per orang) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="teamTasksContainer">
            <!-- Data di-inject JS -->
        </div>
    </div>

    <!-- Baris 3: Kreator Task -->
    <div class="mt-8">
        <div class="card flex flex-col">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                <h2 class="text-xl font-extrabold flex items-center gap-2 text-primary"><i class="ph-fill ph-video-camera text-rose-500"></i> Divisi Kreator Konten</h2>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 h-full mt-2">
                <!-- Kolom Target Deadline -->
                <div>
                    <h3 class="text-sm font-bold text-slate-500 mb-4 flex items-center gap-1 uppercase tracking-wider"><i class="ph-bold ph-calendar-blank text-slate-400"></i> Target Deadline</h3>
                    <div class="space-y-3 overflow-y-auto max-h-[300px] pr-2" id="creatorTasksContainer"></div>
                </div>
                <!-- Kolom Laporan Kerja -->
                <div>
                    <h3 class="text-sm font-bold text-slate-500 mb-4 flex items-center gap-1 uppercase tracking-wider"><i class="ph-bold ph-files text-slate-400"></i> Laporan (2 Hari Terakhir)</h3>
                    <div class="space-y-3 overflow-y-auto max-h-[300px] pr-2" id="creatorReportsContainer"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Set Tanggal Hari Ini
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', options);

    // ==========================================
    // 1. DATA MASTER
    // ==========================================
    const data = {
        jobdesk: [
            {"id": 1, "title": "Memastikan barang sudah di take semua", "pic": "Esa", "desc": "Memastikan tidak ada futech tertinggal"}, 
            {"id": 2, "title": "Menanyakan jadwal prodak apa saja", "pic": "Nazma", "desc": "Menanyakan jadwal prodak hari ini ke admin"}, 
            {"id": 3, "title": "Memastikan barang sudah ada", "pic": "El", "desc": "Memastikan prodak sudah siap untuk di-content"}
        ],
        // Task Tya yang sebelumnya nyangkut di "Nunggu Revisi" sudah DIBUANG dari list ini.
        uncompleted_tasks: [
            {"joCode": "EXTRA", "title": "DADAN CATEXTILE", "assignee": "Nayla", "dateStr": "2026-09-12", "status": "Nunggu Revisi", "priority": "urgent"},
            {"joCode": "EXTRA", "title": "DADAN TUGU INSURANCE", "assignee": "Nayla", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN NICHI NICHI", "assignee": "Indah", "dateStr": "2026-09-10", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "DADAN BLIND BOX PLN", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI TAS BATIK", "assignee": "Nayla", "dateStr": "2026-09-09", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "Hani Labschool", "assignee": "Indah", "dateStr": "2026-09-09", "status": "Lagi Dikerjain", "priority": "urgent"}, 
            {"joCode": "EXTRA", "title": "HANI AMAZON", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "HANI POLLY POCKER", "assignee": "Indah", "dateStr": "2026-09-07", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PELITA", "assignee": "Indah", "dateStr": "2026-09-03", "status": "Tinggal Layout", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN STICKER NAMA", "assignee": "Indah", "dateStr": "2026-08-29", "status": "Nunggu Revisi", "priority": "normal"}, 
            {"joCode": "EXTRA", "title": "A DADAN HULU MIGAS", "assignee": "Indah", "dateStr": "2026-08-27", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN SATYA JKN", "assignee": "Indah", "dateStr": "2026-08-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI WM", "assignee": "Nayla", "dateStr": "2026-08-18", "status": "Tinggal Layout", "priority": "normal"},
            {"joCode": "JO KAK TANIA", "title": "injourney", "assignee": "Nayla", "dateStr": "2026-08-10", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "HANI NOVO NORDISK", "assignee": "Indah", "dateStr": "2026-07-29", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "A DADAN PLN JABARDI", "assignee": "Indah", "dateStr": "2026-07-24", "status": "Nunggu Revisi", "priority": "normal"},
            {"joCode": "EXTRA", "title": "DADAN FLUFFY LAB", "assignee": "Nayla", "dateStr": "2026-07-22", "status": "Nunggu Revisi", "priority": "normal"}
        ],
        creator_tasks: [
            {"title": "Projek Internal Content", "client": "Internal", "targetDate": "2026-06-20"}, 
            {"title": "1. Tugu Insurance - Miniatur 3d", "client": "sania", "targetDate": "2026-09-12"}, 
            {"title": "wa 892 - 190 pcs gantungan & 200 notebook", "client": "sania", "targetDate": "2026-09-12"}
        ],
        recent_reports: [
            {"name": "Elfrida", "dateStr": "12-09-2026", "task": "- Edit konten & story hampers InJourney\n- Take konten TikTok\n- Take video hampers PLN"}, 
            {"name": "Esa", "dateStr": "12-09-2026", "task": "- Take tumbler pertamina\n- Take konten tiktok\n- Edit revisi bookmark hmns\n- Edit konten vo pertamina"}
        ]
    };

    // Helper Functions
    function getStatusBadge(status) {
        const s = status.toLowerCase();
        if (s.includes('final')) return `<span class="badge badge-final">Final</span>`;
        if (s.includes('revisi') || s.includes('to-do')) return `<span class="badge badge-pending">${status}</span>`;
        if (s.includes('kerja') || s.includes('layout')) return `<span class="badge badge-process">${status}</span>`;
        return `<span class="badge badge-pending">${status}</span>`;
    }

    function getPriorityBadge(priority) {
        if ((priority || "").toLowerCase() === 'urgent') {
            return `<span class="urgent-blink uppercase"><i class="ph-fill ph-warning-circle"></i> URGENT</span>`;
        }
        return ``;
    }

    // ==========================================
    // 2. RENDER JOBDESK
    // ==========================================
    document.getElementById('jobdeskCount').innerText = data.jobdesk.length;
    const jobdeskHtml = data.jobdesk.map(item => `
        <div class="flex items-start gap-3 p-3 bg-slate-50 border border-slate-200 rounded-lg hover:bg-slate-100 transition-colors">
            <div class="mt-0.5 text-blue-500"><i class="ph-fill ph-check-circle"></i></div>
            <div class="flex-1">
                <p class="text-sm text-primary font-bold leading-tight">${item.title}</p>
                <p class="text-xs text-muted mt-1 font-medium">${item.desc}</p>
            </div>
            <div class="flex items-center gap-1 bg-white border border-slate-200 px-2 py-1 rounded shadow-sm">
                <span class="text-xs font-bold text-slate-700">${item.pic}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('jobdeskContainer').innerHTML = jobdeskHtml;

    // ==========================================
    // 3. GROUPING TASK PER DESAINER & RENDER
    // ==========================================
    // Menyiapkan 4 desainer utama agar kotaknya selalu muncul meski tasknya 0
    const teamMembers = ["Indah", "Nayla"];
    const groupedTasks = {};
    
    // Inisialisasi awal (semua = 0 task)
    teamMembers.forEach(m => groupedTasks[m] = []);

    // Masukkan data task ke masing-masing nama
    data.uncompleted_tasks.forEach(task => {
        const name = task.assignee.charAt(0).toUpperCase() + task.assignee.slice(1).toLowerCase();
        if(groupedTasks[name] !== undefined) {
            groupedTasks[name].push(task);
        } else {
            groupedTasks[name] = [task];
        }
    });

    const teamContainer = document.getElementById('teamTasksContainer');
    let teamHtml = '';

    // Warna acak pastel untuk avatar
    const colors = ['bg-blue-100 text-blue-600', 'bg-emerald-100 text-emerald-600', 'bg-purple-100 text-purple-600', 'bg-orange-100 text-orange-600'];
    let colorIndex = 0;

    for(const [assignee, tasks] of Object.entries(groupedTasks)) {
        const avatarColor = colors[colorIndex % colors.length];
        colorIndex++;

        // Render card per orang
        teamHtml += `
        <div class="card flex flex-col h-[400px]">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2.5">
                    <div class="h-9 w-9 rounded-full ${avatarColor} flex items-center justify-center font-black text-lg">
                        ${assignee.charAt(0)}
                    </div>
                    <h3 class="font-extrabold text-primary text-lg">${assignee}</h3>
                </div>
                <span class="${tasks.length > 0 ? 'bg-slate-100 text-slate-600 border-slate-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200'} text-xs font-bold px-2.5 py-1 rounded-md border">${tasks.length} Task</span>
            </div>
            
            <div class="overflow-y-auto pr-1 flex-1">
                ${tasks.length > 0 ? `<div class="space-y-3">` + tasks.map(t => `
                    <div class="p-3 border border-slate-200 rounded-lg hover:border-slate-300 transition-all ${t.priority?.toLowerCase() === 'urgent' ? 'bg-red-50/40 border-red-200' : 'bg-slate-50'}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold text-slate-500 bg-white border border-slate-200 px-1.5 py-0.5 rounded shadow-sm">${t.joCode}</span>
                            ${getStatusBadge(t.status)}
                        </div>
                        <p class="text-sm font-bold text-primary leading-tight mb-2">${t.title}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-[10px] text-slate-400 font-bold font-mono bg-white px-1.5 py-0.5 rounded border border-slate-100"><i class="ph-bold ph-calendar-blank"></i> ${t.dateStr}</span>
                            ${getPriorityBadge(t.priority)}
                        </div>
                    </div>
                `).join('') + `</div>` : `
                    <!-- EMPTY STATE JIKA TASK 0 (Contoh: Tya) -->
                    <div class="flex flex-col items-center justify-center h-full text-center pb-8 opacity-80">
                        <i class="ph-fill ph-check-circle text-6xl text-emerald-400 mb-3 drop-shadow-sm"></i>
                        <p class="text-sm font-extrabold text-slate-600">Semua Clear!</p>
                        <p class="text-xs font-medium text-slate-400 mt-1">Kerjaan sudah beres semua.</p>
                    </div>
                `}
            </div>
        </div>
        `;
    }
    teamContainer.innerHTML = teamHtml;

    // ==========================================
    // 4. RENDER KREATOR TASK & REPORT
    // ==========================================
    const cTaskHtml = data.creator_tasks.map(c => `
        <div class="p-3.5 bg-white shadow-sm border-l-4 border-l-rose-400 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">
            <p class="text-sm font-bold text-primary line-clamp-2">${c.title}</p>
            <div class="flex items-center justify-between mt-3 text-xs">
                <span class="text-muted font-bold bg-slate-100 px-2 py-1 rounded"><i class="ph-bold ph-user mr-1"></i>${c.client}</span>
                <span class="text-rose-600 font-mono font-bold"><i class="ph-bold ph-clock mr-1"></i>${c.targetDate}</span>
            </div>
        </div>
    `).join('');
    document.getElementById('creatorTasksContainer').innerHTML = cTaskHtml;

    const cReportHtml = data.recent_reports.map(r => `
        <div class="p-4 bg-slate-50 border border-slate-200 rounded-lg relative overflow-hidden">
            <div class="absolute top-0 right-0 p-2 opacity-5"><i class="ph-fill ph-quotes text-5xl text-slate-800"></i></div>
            <div class="flex items-center gap-3 mb-3 border-b border-slate-200 pb-2">
                <div class="h-8 w-8 rounded-full bg-blue-600 flex items-center justify-center text-sm font-black text-white shadow">${r.name.charAt(0)}</div>
                <span class="text-sm font-extrabold text-primary">${r.name}</span>
                <span class="text-[10px] text-muted font-mono ml-auto bg-white border border-slate-200 px-2 py-1 rounded shadow-sm">${r.dateStr}</span>
            </div>
            <div class="text-xs text-slate-600 whitespace-pre-line leading-relaxed font-semibold pl-1">${r.task}</div>
        </div>
    `).join('');
    document.getElementById('creatorReportsContainer').innerHTML = cReportHtml;

    // ==========================================
    // 5. INIT CHART.JS 
    // ==========================================
    const ctx = document.getElementById('productivityChart').getContext('2d');
    
    const chartLabels = ["2 Sep", "3 Sep", "4 Sep", "7 Sep", "8 Sep", "9 Sep", "10 Sep", "11 Sep", "12 Sep"];
    const designTrend = [1, 5, 2, 6, 2, 5, 5, 2, 3];
    const contentTrend = [0, 0, 0, 0, 0, 0, 0, 0, 4];

    Chart.defaults.color = '#64748b'; 
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.font.weight = '600';

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartLabels,
            datasets: [
                {
                    label: 'Project Desain',
                    data: designTrend,
                    borderColor: '#3b82f6', 
                    backgroundColor: 'rgba(59, 130, 246, 0.12)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#3b82f6',
                    pointBorderWidth: 2,
                    pointRadius: 4
                },
                {
                    label: 'Project Konten',
                    data: contentTrend,
                    borderColor: '#10b981',  
                    backgroundColor: 'rgba(16, 185, 129, 0.12)',
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#10b981',
                    pointBorderWidth: 2,
                    pointRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { boxWidth: 12, usePointStyle: true, color: '#0f172a', font: { weight: 'bold' } } },
                tooltip: { backgroundColor: '#0f172a', borderColor: '#334155', borderWidth: 1, titleColor: '#f8fafc', bodyColor: '#cbd5e1', padding: 10, cornerRadius: 8 }
            },
            scales: {
                y: { beginAtZero: true, grid: { color: '#f1f5f9', drawBorder: false }, border: { dash: [4, 4] } },
                x: { grid: { display: false, drawBorder: false } }
            }
        }
    });
</script>
</body>
</html>
