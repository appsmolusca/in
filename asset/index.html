<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetHub - Minimalist Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        
        /* Hilangkan scrollbar bawaan agar lebih bersih */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #4F46E5;
            border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col md:flex-row overflow-hidden">

    <div class="md:hidden glass-effect border-b border-slate-200 px-6 py-4 flex justify-between items-center z-20">
        <h1 class="text-xl font-bold text-indigo-600"><i class="fa-solid fa-layer-group mr-2"></i>AssetHub</h1>
        <button onclick="openModal()" class="bg-indigo-600 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center hover:bg-indigo-700 active:scale-95 transition-transform">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <aside class="hidden md:flex flex-col w-72 bg-white border-r border-slate-200 h-full z-10">
        <div class="p-8">
            <h1 class="text-2xl font-bold text-indigo-600 tracking-tight"><i class="fa-solid fa-layer-group mr-2"></i>AssetHub</h1>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-indigo-50 text-indigo-600 rounded-2xl font-semibold transition-all">
                <i class="fa-solid fa-border-all text-lg"></i> Dashboard
            </a>
            </nav>
        <div class="p-4">
            <button onclick="openModal()" class="w-full bg-slate-900 text-white px-4 py-4 rounded-2xl font-semibold shadow-lg hover:bg-slate-800 hover:shadow-xl transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-plus"></i> Tambah Aset Baru
            </button>
        </div>
    </aside>

    <main class="flex-1 h-full overflow-y-auto relative pb-20 md:pb-0">
        
        <div class="max-w-7xl mx-auto p-6 md:p-8 space-y-8">
            
            <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-center items-center text-center">
                    <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-4">
                        <i class="fa-solid fa-box-archive"></i>
                    </div>
                    <p class="text-slate-500 font-medium">Total Aset Desain</p>
                    <h2 class="text-4xl font-bold text-slate-800 mt-1" id="totalAset">0</h2>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm lg:col-span-2 relative h-48 lg:h-full flex flex-col">
                    <p class="text-slate-500 font-medium mb-2">Sebaran Kategori Aset</p>
                    <div class="flex-1 w-full relative">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </section>

            <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                <h3 class="text-xl font-bold text-slate-800">Koleksi Aset</h3>
            </div>

            <div id="assetsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400" id="loadingData">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-indigo-500"></i>
                    <p class="font-medium">Mensinkronisasi data...</p>
                </div>
            </div>

        </div>
    </main>

    <button onclick="openModal()" class="md:hidden fixed bottom-6 right-6 bg-slate-900 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-xl z-30 active:scale-90 transition-transform">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div id="assetModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-end md:items-center justify-center md:p-4 opacity-0 transition-opacity duration-300">
        
        <div class="bg-white w-full md:max-w-2xl md:rounded-3xl rounded-t-3xl shadow-2xl max-h-[90vh] flex flex-col transform translate-y-full md:translate-y-0 transition-transform duration-300" id="modalContent">
            
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white md:rounded-t-3xl rounded-t-3xl z-10">
                <h3 class="text-lg font-bold text-slate-800" id="modalTitle">Tambah Aset Baru</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-100 text-slate-500 rounded-full hover:bg-red-50 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form id="assetForm" class="p-6 overflow-y-auto space-y-5">
                <input type="hidden" id="assetId">
                <input type="hidden" id="existingImageUrl">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-600">Nama Aset</label>
                        <input type="text" id="itemName" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all" placeholder="Contoh: Banner Promo 1">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-600">Kategori</label>
                        <input type="text" id="itemCategory" list="categories" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all" placeholder="Pilih atau ketik baru...">
                        <datalist id="categories">
                            <option value="Logo"></option>
                            <option value="Instagram Feed"></option>
                            <option value="Story/Reels"></option>
                            <option value="Mockup Produk"></option>
                        </datalist>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-600">File Gambar (Cloudinary)</label>
                    <div class="relative">
                        <input type="file" id="itemImage" accept="image/*" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 cursor-pointer focus:outline-none text-slate-500">
                    </div>
                    <p id="imageHelperText" class="text-xs text-slate-400 hidden"><i class="fa-solid fa-circle-info mr-1"></i>Abaikan jika tidak ingin mengubah gambar.</p>
                </div>

                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-600">Tautan Desain (Siap Edit)</label>
                    <div id="linksContainer" class="space-y-3">
                        </div>
                </div>

                <div class="h-4 md:h-0"></div>
            </form>

            <div class="p-6 border-t border-slate-100 bg-slate-50 md:rounded-b-3xl flex justify-end gap-3 sticky bottom-0">
                <button type="button" onclick="closeModal()" class="px-6 py-3 text-slate-600 font-semibold rounded-2xl hover:bg-slate-200 transition-colors">Batal</button>
                <button type="submit" form="assetForm" id="submitBtn" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 transition-all flex items-center">
                    <span id="submitText">Simpan Aset</span>
                    <div id="submitLoader" class="loader ml-3 hidden"></div>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIG FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDoX3MZ0hxtL2j3ol3N_1w8ohYCdXPsUtI",
            authDomain: "appmoluscadesign.firebaseapp.com",
            databaseURL: "https://appmoluscadesign-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "appmoluscadesign",
            storageBucket: "appmoluscadesign.firebasestorage.app",
            messagingSenderId: "800709666958",
            appId: "1:800709666958:web:66f97b271f736e17c981df"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        const assetsRef = db.ref('assets');

        // --- 2. CONFIG CLOUDINARY (Sesuai Gambar) ---
        const CLOUD_NAME = 'dhs6vrcdp';
        const UPLOAD_PRESET = 'molusca_izin';
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

        // --- 3. REFERENSI DOM ---
        const modal = document.getElementById('assetModal');
        const modalContent = document.getElementById('modalContent');
        const form = document.getElementById('assetForm');
        const linksContainer = document.getElementById('linksContainer');
        const assetsContainer = document.getElementById('assetsContainer');
        
        // --- 4. INIT CHART.JS (KURVA) ---
        let myChart;
        function initChart(dataKategori) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'bar', // Menggunakan bar yang dibuat melengkung agar modern
                data: {
                    labels: Object.keys(dataKategori),
                    datasets: [{
                        label: 'Jumlah Aset',
                        data: Object.values(dataKategori),
                        backgroundColor: '#818CF8',
                        borderRadius: 8, // Kurva membulat pada grafik
                        barThickness: 30
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash:, color: '#E2E8F0' }, ticks: { stepSize: 1 } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // --- 5. LOGIKA UI (MODAL & LINKS) ---
        function openModal(isEdit = false) {
            modal.classList.remove('hidden');
            // Animasi masuk
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('translate-y-full');
            }, 10);

            if(!isEdit) {
                form.reset();
                document.getElementById('assetId').value = '';
                document.getElementById('existingImageUrl').value = '';
                document.getElementById('modalTitle').innerText = 'Tambah Aset Baru';
                resetLinks();
                document.getElementById('imageHelperText').classList.add('hidden');
                document.getElementById('itemImage').required = true;
            }
        }

        function closeModal() {
            // Animasi keluar
            modal.classList.add('opacity-0');
            modalContent.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function addLinkField(value = '') {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <div class="flex-1 relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-link text-sm"></i>
                    </div>
                    <input type="url" name="assetLink[]" value="${value}" required placeholder="https://canva.com/..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all">
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="w-12 h-12 flex-shrink-0 bg-red-50 text-red-500 rounded-2xl hover:bg-red-100 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;
            linksContainer.appendChild(div);
        }

        function resetLinks() {
            linksContainer.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <div class="flex-1 relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-link text-sm"></i>
                    </div>
                    <input type="url" name="assetLink[]" required placeholder="https://canva.com/..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all">
                </div>
                <button type="button" onclick="addLinkField()" class="w-12 h-12 flex-shrink-0 bg-indigo-50 text-indigo-600 rounded-2xl hover:bg-indigo-100 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-plus text-lg"></i>
                </button>
            `;
            linksContainer.appendChild(div);
        }

        // --- 6. RENDER DATA (REALTIME MENDENGARKAN FIREBASE) ---
        assetsRef.on('value', (snapshot) => {
            const loadingData = document.getElementById('loadingData');
            if(loadingData) loadingData.remove();
            
            assetsContainer.innerHTML = '';
            
            const data = snapshot.val();
            const kategoriCount = {};
            let total = 0;
            
            if (data) {
                const assetArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                total = assetArray.length;

                assetArray.forEach(asset => {
                    // Hitung kategori untuk kurva/chart
                    kategoriCount[asset.category] = (kategoriCount[asset.category] || 0) + 1;

                    // Buat tombol link
                    let linksHTML = '';
                    asset.links.forEach((link, index) => {
                        linksHTML += `
                            <a href="${link}" target="_blank" class="w-full inline-flex justify-center items-center gap-2 bg-slate-50 hover:bg-slate-100 border border-slate-100 text-slate-600 text-sm font-semibold py-2.5 px-4 rounded-xl mb-2 transition-colors">
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i> File ${index + 1}
                            </a>`;
                    });

                    // Desain Kartu Melengkung Modern
                    const card = `
                        <div class="bg-white rounded-3xl p-3 border border-slate-100 shadow-sm hover:shadow-xl transition-shadow duration-300 group flex flex-col h-full">
                            <div class="relative w-full h-48 rounded-2xl overflow-hidden bg-slate-100 mb-4 group-hover:opacity-95 transition-opacity">
                                <img src="${asset.imageUrl}" alt="${asset.name}" class="w-full h-full object-cover">
                                <div class="absolute top-3 right-3 flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                    <button onclick="editAsset('${asset.id}')" class="w-8 h-8 bg-white/90 backdrop-blur text-slate-700 rounded-full flex items-center justify-center hover:text-indigo-600 shadow-sm"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button onclick="deleteAsset('${asset.id}')" class="w-8 h-8 bg-white/90 backdrop-blur text-slate-700 rounded-full flex items-center justify-center hover:text-red-500 shadow-sm"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                                <div class="absolute bottom-3 left-3">
                                    <span class="bg-slate-900/70 backdrop-blur-md text-white text-xs font-semibold px-3 py-1.5 rounded-full">${asset.category}</span>
                                </div>
                            </div>
                            <div class="px-2 flex-1 flex flex-col">
                                <h3 class="font-bold text-slate-800 text-lg leading-tight mb-4 line-clamp-2">${asset.name}</h3>
                                <div class="mt-auto pt-2 border-t border-slate-50">
                                    <div class="max-h-[140px] overflow-y-auto pr-1">
                                        ${linksHTML}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    assetsContainer.insertAdjacentHTML('beforeend', card);
                });
            } else {
                assetsContainer.innerHTML = '<div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400"><i class="fa-solid fa-box-open text-4xl mb-4 text-slate-300"></i><p class="font-medium">Belum ada aset. Tambahkan sekarang!</p></div>';
            }
            
            document.getElementById('totalAset').innerText = total;
            
            // Render Kurva Dashboard
            initChart(kategoriCount);
        });

        // --- 7. CREATE & UPDATE ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const txt = document.getElementById('submitText');
            const loader = document.getElementById('submitLoader');
            
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            txt.innerText = 'Mengunggah...';
            loader.classList.remove('hidden');

            const id = document.getElementById('assetId').value;
            const name = document.getElementById('itemName').value;
            const category = document.getElementById('itemCategory').value;
            const imageFile = document.getElementById('itemImage').files;
            const existingImageUrl = document.getElementById('existingImageUrl').value;
            
            const linkInputs = document.querySelectorAll('input[name="assetLink[]"]');
            const links = Array.from(linkInputs).map(input => input.value).filter(val => val !== '');

            let imageUrl = existingImageUrl;

            try {
                if (imageFile) {
                    const formData = new FormData();
                    formData.append('file', imageFile);
                    formData.append('upload_preset', UPLOAD_PRESET);

                    const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                    const uploadResult = await response.json();
                    
                    if(uploadResult.secure_url) { imageUrl = uploadResult.secure_url; } 
                    else { throw new Error("Gagal upload ke Cloudinary."); }
                }

                const assetData = {
                    name: name, category: category, imageUrl: imageUrl, links: links,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                };

                if (id) { await assetsRef.child(id).update(assetData); } 
                else {
                    assetData.createdAt = firebase.database.ServerValue.TIMESTAMP;
                    await assetsRef.push(assetData);
                }

                closeModal();

            } catch (error) {
                console.error(error);
                alert('Terjadi kesalahan: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                txt.innerText = 'Simpan Aset';
                loader.classList.add('hidden');
            }
        });

        // --- 8. EDIT ---
        function editAsset(id) {
            assetsRef.child(id).once('value', snapshot => {
                const data = snapshot.val();
                if(data) {
                    document.getElementById('modalTitle').innerText = 'Edit Aset';
                    document.getElementById('assetId').value = id;
                    document.getElementById('itemName').value = data.name;
                    document.getElementById('itemCategory').value = data.category;
                    document.getElementById('existingImageUrl').value = data.imageUrl;
                    
                    document.getElementById('itemImage').required = false;
                    document.getElementById('imageHelperText').classList.remove('hidden');

                    linksContainer.innerHTML = '';
                    data.links.forEach((link, index) => {
                        if (index === 0) {
                            const div = document.createElement('div');
                            div.className = 'flex gap-2 items-center';
                            div.innerHTML = `
                                <div class="flex-1 relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-link text-sm"></i>
                                    </div>
                                    <input type="url" name="assetLink[]" value="${link}" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all">
                                </div>
                                <button type="button" onclick="addLinkField()" class="w-12 h-12 flex-shrink-0 bg-indigo-50 text-indigo-600 rounded-2xl hover:bg-indigo-100 flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-plus text-lg"></i>
                                </button>
                            `;
                            linksContainer.appendChild(div);
                        } else {
                            addLinkField(link);
                        }
                    });

                    openModal(true);
                }
            });
        }

        // --- 9. DELETE ---
        function deleteAsset(id) {
            if(confirm('Hapus aset permanen?')) {
                assetsRef.child(id).remove().catch(err => alert("Gagal: " + err.message));
            }
        }
    </script>
</body>
</html>
