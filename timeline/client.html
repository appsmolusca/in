<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Klien - Lacak Pesanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col relative overflow-hidden">
    
    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-br from-blue-600 to-indigo-900 opacity-20 blur-3xl -z-10"></div>
    <i class="ph-fill ph-package absolute -right-20 -bottom-20 text-[300px] text-white opacity-5 -z-10"></i>

    <div class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-xl mx-auto">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4 border border-blue-400/30">
                <i class="ph-bold ph-rocket text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight mb-2">Portal Tracking</h1>
            <p class="text-sm font-medium text-slate-400">Lacak status pesanan dan produksi hampers Anda secara Real-Time.</p>
        </div>

        <div class="w-full bg-white/10 backdrop-blur-md p-2 rounded-2xl border border-white/20 shadow-xl flex items-center mb-6">
            <input type="text" id="inputCekResi" placeholder="Masukkan Resi (cth: MOL-XXXXX)" class="w-full bg-transparent p-4 text-white font-black uppercase tracking-widest outline-none placeholder-slate-400">
            <button onclick="cekResi()" class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl font-black transition shadow-md shadow-blue-500/20">
                <i class="ph-bold ph-magnifying-glass text-xl"></i>
            </button>
        </div>

        <div id="errorKlien" class="hidden w-full text-center text-red-300 text-xs font-bold p-4 bg-red-900/30 border border-red-500/30 rounded-xl backdrop-blur-md">
            Resi tidak ditemukan. Periksa kembali penulisan Anda.
        </div>

        <div id="resultKlien" class="hidden w-full bg-white rounded-[32px] p-6 shadow-2xl">
            <div class="border-b border-slate-100 pb-4 mb-6 text-center">
                <div class="text-[10px] uppercase font-bold text-slate-400 tracking-widest mb-1">Pesanan Atas Nama</div>
                <div class="font-black text-slate-900 text-2xl" id="resKlien">...</div>
                <div class="text-xs font-bold text-blue-600 mt-1" id="resPekerjaan">...</div>
            </div>

            <div class="relative flex justify-between items-center px-4 mb-8">
                <div class="absolute left-6 right-6 top-1/2 -translate-y-1/2 h-1.5 bg-slate-100 -z-10 rounded-full"></div>
                <div id="stepProgress" class="absolute left-6 top-1/2 -translate-y-1/2 h-1.5 bg-blue-500 -z-10 rounded-full transition-all duration-700" style="width: 0%"></div>
                
                <div class="flex flex-col items-center">
                    <div id="step1" class="w-10 h-10 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center font-black text-lg shadow-sm border-4 border-white"><i class="ph-bold ph-paint-brush"></i></div>
                    <span class="text-[9px] font-bold mt-2 text-slate-500 uppercase">Desain</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="step2" class="w-10 h-10 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center font-black text-lg shadow-sm border-4 border-white"><i class="ph-bold ph-scissors"></i></div>
                    <span class="text-[9px] font-bold mt-2 text-slate-500 uppercase">Sample</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="step3" class="w-10 h-10 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center font-black text-lg shadow-sm border-4 border-white"><i class="ph-bold ph-factory"></i></div>
                    <span class="text-[9px] font-bold mt-2 text-slate-500 uppercase">Produksi</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="step4" class="w-10 h-10 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center font-black text-lg shadow-sm border-4 border-white"><i class="ph-bold ph-check-circle"></i></div>
                    <span class="text-[9px] font-bold mt-2 text-slate-500 uppercase">Selesai</span>
                </div>
            </div>

            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-6">
                <h3 class="text-[10px] font-black uppercase text-slate-400 mb-2 flex items-center gap-1"><i class="ph-fill ph-info"></i> Rincian Progress</h3>
                <p id="resDetail" class="text-xs text-slate-700 font-semibold leading-relaxed">...</p>
            </div>

            <a id="btnPdf" href="#" target="_blank" class="hidden w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-xl text-xs font-black uppercase justify-center items-center gap-2 transition shadow-lg">
                <i class="ph-bold ph-file-pdf text-lg text-red-400"></i> Tampilkan & Download PDF
            </a>
            <div id="noPdf" class="hidden text-center text-[10px] font-bold text-slate-400 uppercase">
                File PDF / Invoice belum tersedia
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDoX3MZ0hxtL2j3ol3N_1w8ohYCdXPsUtI",
            authDomain: "appmoluscadesign.firebaseapp.com",
            databaseURL: "https://appmoluscadesign-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "appmoluscadesign",
            storageBucket: "appmoluscadesign.firebasestorage.app",
            messagingSenderId: "800709666958",
            appId: "1:800709666958:web:66f97b271f736e17c981df"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const refProject = db.ref('project_molusca_v3');
        let globalData = [];

        refProject.on('value', snap => {
            const data = snap.val();
            if(data) globalData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        });

        function cekResi() {
            const resi = document.getElementById('inputCekResi').value.trim().toUpperCase();
            if(!resi) return;
            
            const data = globalData.find(p => p.resiCode === resi);
            
            if(data) {
                document.getElementById('errorKlien').classList.add('hidden');
                document.getElementById('resultKlien').classList.remove('hidden');
                
                document.getElementById('resKlien').innerText = data.klien;
                document.getElementById('resPekerjaan').innerText = data.pekerjaan;
                document.getElementById('resDetail').innerText = data.detailProgress || "Belum ada catatan detail dari tim.";

                // Handle PDF Button
                const btnPdf = document.getElementById('btnPdf');
                const noPdf = document.getElementById('noPdf');
                if(data.pdfLink && data.pdfLink.trim() !== '') {
                    btnPdf.href = data.pdfLink;
                    btnPdf.classList.replace('hidden', 'flex');
                    noPdf.classList.add('hidden');
                } else {
                    btnPdf.classList.replace('flex', 'hidden');
                    noPdf.classList.remove('hidden');
                }

                // Stepper Logic
                const s1 = document.getElementById('step1'), s2 = document.getElementById('step2'), s3 = document.getElementById('step3'), s4 = document.getElementById('step4');
                const prog = document.getElementById('stepProgress');
                
                [s1, s2, s3, s4].forEach(s => { s.className = 'w-10 h-10 rounded-full bg-slate-100 text-slate-300 flex items-center justify-center font-black text-lg border-4 border-white'; });
                
                let w = '0%';
                let activeClass = 'w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-black text-lg shadow-lg border-4 border-blue-100 ring-4 ring-blue-50 scale-110 transition';
                let pastClass = 'w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-black text-lg border-4 border-white';

                if(['Proses', 'Desain'].includes(data.status)) {
                    s1.className = activeClass; w = '0%';
                } else if (data.status === 'Sample') {
                    s1.className = pastClass; s2.className = activeClass; w = '33%';
                } else if (data.status === 'Produksi') {
                    s1.className = pastClass; s2.className = pastClass; s3.className = activeClass; w = '66%';
                } else if (data.status === 'Selesai') {
                    s1.className = pastClass; s2.className = pastClass; s3.className = pastClass; 
                    s4.className = 'w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center font-black text-lg shadow-lg border-4 border-emerald-100 ring-4 ring-emerald-50 scale-110 transition'; 
                    w = '100%';
                    prog.className = 'absolute left-6 top-1/2 -translate-y-1/2 h-1.5 bg-emerald-500 -z-10 rounded-full transition-all duration-700';
                }
                prog.style.width = w;

            } else {
                document.getElementById('resultKlien').classList.add('hidden');
                document.getElementById('errorKlien').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
