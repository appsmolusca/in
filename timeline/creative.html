<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim Kreatif - Project Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; } 
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="pb-20 text-slate-800" onload="initApp()">

    <header class="bg-slate-900 sticky top-0 z-40 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-slate-800 p-2 rounded-xl border border-slate-700">
                <i class="ph-fill ph-kanban text-2xl text-blue-400"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tight text-white leading-none">Creative Board</h1>
                <div class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-wider">Tampilan Khusus Monitor (Read-Only)</div>
            </div>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-7xl mx-auto space-y-6 mt-4">
        
        <h2 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-4 flex items-center gap-2">
            <i class="ph-fill ph-squares-four text-blue-500 text-xl"></i> Papan Monitor Tim
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start" id="kanbanBoard">
            <div class="bg-slate-100/80 rounded-2xl p-3 border border-slate-200">
                <div class="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-3 ml-1 flex justify-between"><span>🎨 Desain & Revisi</span> <span id="countDesain" class="bg-slate-200 px-2 rounded-md">0</span></div>
                <div id="colDesain" class="space-y-3 min-h-[100px]"></div>
            </div>
            <div class="bg-indigo-50/80 rounded-2xl p-3 border border-indigo-100">
                <div class="text-[10px] font-black uppercase tracking-widest text-indigo-600 mb-3 ml-1 flex justify-between"><span>✂️ Pembuatan Sample</span> <span id="countSample" class="bg-indigo-100 px-2 rounded-md">0</span></div>
                <div id="colSample" class="space-y-3 min-h-[100px]"></div>
            </div>
            <div class="bg-orange-50/80 rounded-2xl p-3 border border-orange-100">
                <div class="text-[10px] font-black uppercase tracking-widest text-orange-600 mb-3 ml-1 flex justify-between"><span>📦 Produksi & QC</span> <span id="countProduksi" class="bg-orange-100 px-2 rounded-md">0</span></div>
                <div id="colProduksi" class="space-y-3 min-h-[100px]"></div>
            </div>
            <div class="bg-emerald-50/80 rounded-2xl p-3 border border-emerald-100">
                <div class="text-[10px] font-black uppercase tracking-widest text-emerald-600 mb-3 ml-1 flex justify-between"><span>✅ Selesai</span> <span id="countSelesai" class="bg-emerald-100 px-2 rounded-md">0</span></div>
                <div id="colSelesai" class="space-y-3 min-h-[100px]"></div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDoX3MZ0hxtL2j3ol3N_1w8ohYCdXPsUtI",
            authDomain: "appmoluscadesign.firebaseapp.com",
            databaseURL: "https://appmoluscadesign-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "appmoluscadesign",
            storageBucket: "appmoluscadesign.firebasestorage.app",
            messagingSenderId: "800709666958",
            appId: "1:800709666958:web:66f97b271f736e17c981df"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const refProject = db.ref('project_molusca_pro');

        function initApp() {
            refProject.on('value', snap => {
                const data = snap.val();
                let arrData = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
                renderKanban(arrData);
            });
        }

        function getDeadlineInfo(deadlineStr, status) {
            if(status === 'Selesai') return { text: 'Selesai', color: 'bg-emerald-100 text-emerald-700' };
            const diffDays = Math.ceil((new Date(deadlineStr) - new Date().setHours(0,0,0,0)) / 86400000);
            if (diffDays < 0) return { text: `Telat ${Math.abs(diffDays)} Hari`, color: 'bg-red-100 text-red-700 border border-red-200 shadow-sm shadow-red-200' };
            if (diffDays === 0) return { text: 'Deadline Hari Ini!', color: 'bg-orange-100 text-orange-700 border border-orange-200 animate-pulse' };
            if (diffDays <= 3) return { text: `${diffDays} Hari Lagi`, color: 'bg-yellow-100 text-yellow-700' };
            return { text: `${diffDays} Hari Lagi`, color: 'bg-blue-50 text-blue-600' };
        }

        function renderKanban(arrData) {
            let htmlDesain = '', htmlSample = '', htmlProduksi = '', htmlSelesai = '';
            let cD = 0, cS = 0, cP = 0, cSel = 0;

            arrData.forEach(p => {
                const deadline = getDeadlineInfo(p.tglDeadline, p.status);
                const isUrgent = deadline.text.includes('Telat') || deadline.text.includes('Hari Ini');

                const cardHTML = `
                    <div class="bg-white p-4 rounded-xl border ${isUrgent ? 'border-red-400 border-2' : 'border-slate-200'} shadow-sm relative">
                        <div class="text-[9px] font-black text-slate-400 tracking-wider mb-1">${p.resiCode}</div>
                        <h4 class="font-black text-sm text-slate-800 leading-tight mb-1">${p.klien}</h4>
                        <div class="text-[10px] text-slate-600 font-semibold mb-3 border-b border-slate-100 pb-2">${p.pekerjaan}</div>
                        <div class="flex justify-between items-center">
                            <div class="inline-block px-2 py-1 rounded-md text-[9px] font-black uppercase ${deadline.color}">${deadline.text}</div>
                            <div class="text-[9px] font-black text-slate-400 uppercase"><i class="ph-fill ph-user-circle"></i> PIC: ${p.pic}</div>
                        </div>
                    </div>
                `;

                if(p.status === 'Selesai') { htmlSelesai += cardHTML; cSel++; }
                else if(p.status === 'Sample') { htmlSample += cardHTML; cS++; }
                else if(['Packing', 'QC', 'Siap Kirim', 'Produksi'].includes(p.status) || ['Packing', 'QC', 'Siap Kirim'].includes(p.finishing)) { htmlProduksi += cardHTML; cP++; }
                else { htmlDesain += cardHTML; cD++; }
            });

            document.getElementById('colDesain').innerHTML = htmlDesain;
            document.getElementById('colSample').innerHTML = htmlSample;
            document.getElementById('colProduksi').innerHTML = htmlProduksi;
            document.getElementById('colSelesai').innerHTML = htmlSelesai;

            document.getElementById('countDesain').innerText = cD;
            document.getElementById('countSample').innerText = cS;
            document.getElementById('countProduksi').innerText = cP;
            document.getElementById('countSelesai').innerText = cSel;
        }
    </script>
</body>
</html>
