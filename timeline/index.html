<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Project Molusca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; } 
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="pb-20 text-slate-800" onload="initApp()">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 px-6 py-4 border-b border-slate-200 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-indigo-600 to-blue-600 p-2 rounded-xl shadow-lg shadow-blue-500/30">
                <i class="ph-bold ph-rocket text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tight leading-none">Admin Molusca <span class="text-blue-600">Pro</span></h1>
                <div class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-wider">Super Admin Dashboard</div>
            </div>
        </div>
        <div class="flex gap-2">
            <a href="client.html" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl text-xs font-black uppercase flex items-center gap-2 transition">
                <i class="ph-bold ph-magnifying-glass"></i> Tes Portal Klien
            </a>
            <a href="creative.html" target="_blank" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-black uppercase flex items-center gap-2 transition">
                <i class="ph-bold ph-eye"></i> View Kreatif
            </a>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-black uppercase flex items-center gap-2 transition shadow-md shadow-blue-500/30">
                <i class="ph-bold ph-plus"></i> Project Baru
            </button>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-7xl mx-auto space-y-6 mt-4">
        <div class="bg-white p-2 rounded-2xl border border-slate-200 shadow-sm flex items-center focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100 transition">
            <i class="ph-bold ph-magnifying-glass text-slate-400 text-xl ml-3"></i>
            <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Cari nomor resi, klien, atau PIC..." class="w-full bg-transparent p-3 text-sm font-semibold outline-none placeholder-slate-400">
        </div>

        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden mt-8">
            <div class="p-5 border-b border-slate-100 bg-slate-50">
                <h3 class="text-xs font-black text-slate-800 uppercase tracking-widest">Master Data (Bisa Edit)</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-50 text-[10px] uppercase font-black text-slate-400">
                        <tr>
                            <th class="px-5 py-3">Resi & Klien</th>
                            <th class="px-5 py-3">Deadline</th>
                            <th class="px-5 py-3">Status Utama</th>
                            <th class="px-5 py-3 text-right">Aksi Admin</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-slate-100 text-xs font-medium">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modalForm" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[24px] w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="sticky top-0 bg-white/90 backdrop-blur z-10 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-sm font-black uppercase tracking-widest text-slate-800">Form Project</h2>
                <button onclick="closeModal('modalForm')" class="bg-slate-100 p-2 rounded-full text-slate-500 hover:bg-slate-200 transition"><i class="ph-bold ph-x"></i></button>
            </div>
            <form id="projectForm" onsubmit="saveData(event)" class="p-6 space-y-4">
                <input type="hidden" id="inputId">
                <input type="hidden" id="inputResiCode">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nama Klien</label>
                        <input type="text" id="inputKlien" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tgl Deadline</label>
                        <input type="date" id="inputTglDeadline" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Detail Pekerjaan (Singkat)</label>
                    <input type="text" id="inputPekerjaan" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none">
                </div>

                <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100 space-y-4">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-blue-600"><i class="ph-bold ph-eye"></i> Tampilan di Portal Klien</h3>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Status Progres Saat Ini</label>
                        <select id="inputStatus" class="w-full bg-white border border-blue-200 rounded-xl p-2.5 text-xs outline-none font-bold text-blue-700 shadow-sm">
                            <option value="Proses">⏳ Konfirmasi & Proses Awal</option>
                            <option value="Desain">🖌️ Proses Desain</option>
                            <option value="Sample">✂️ Pembuatan Sample</option>
                            <option value="Produksi">🏭 Produksi Massal Hampers</option>
                            <option value="Selesai">✅ Selesai & Siap Kirim</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Catatan Detail Progress (Terlihat oleh klien)</label>
                        <textarea id="inputDetailProgress" rows="3" placeholder="Contoh: Saat ini sedang proses perakitan box hampers 50/100 pcs..." class="w-full bg-white border border-blue-200 rounded-xl p-2.5 text-xs outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Link PDF (Invoice / Desain Acc) - Kosongkan jika tidak ada</label>
                        <input type="url" id="inputPdfLink" placeholder="https://drive.google.com/..." class="w-full bg-white border border-blue-200 rounded-xl p-2.5 text-xs outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-xs font-black uppercase shadow-md transition">Simpan Project</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDoX3MZ0hxtL2j3ol3N_1w8ohYCdXPsUtI",
            authDomain: "appmoluscadesign.firebaseapp.com",
            databaseURL: "https://appmoluscadesign-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "appmoluscadesign",
            storageBucket: "appmoluscadesign.firebasestorage.app",
            messagingSenderId: "800709666958",
            appId: "1:800709666958:web:66f97b271f736e17c981df"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const refProject = db.ref('project_molusca_v3'); // DB Baru

        let globalData = [];
        let filteredData = [];

        function initApp() {
            refProject.on('value', snap => {
                const data = snap.val();
                globalData = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
                handleSearch();
            });
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            filteredData = q ? globalData.filter(p => p.klien.toLowerCase().includes(q) || p.resiCode.toLowerCase().includes(q)) : [...globalData];
            renderTable();
        }

        function renderTable() {
            let html = '';
            filteredData.forEach(p => {
                html += `
                <tr class="hover:bg-slate-50 border-b border-slate-100">
                    <td class="px-5 py-3">
                        <div class="text-[10px] font-black text-blue-600 bg-blue-50 inline-block px-2 py-1 rounded mb-1 border border-blue-100">${p.resiCode}</div>
                        <div class="font-black text-slate-800 text-sm">${p.klien}</div>
                    </td>
                    <td class="px-5 py-3 font-bold text-slate-600">${p.tglDeadline}</td>
                    <td class="px-5 py-3 font-black text-[10px] uppercase text-slate-500">${p.status}</td>
                    <td class="px-5 py-3 text-right">
                        <button onclick="editData('${p.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase shadow-md"><i class="ph-bold ph-pencil-simple"></i> Edit</button>
                    </td>
                </tr>`;
            });
            document.getElementById('dataTableBody').innerHTML = html;
        }

        function generateResi() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let res = 'MOL-';
            for(let i=0; i<5; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            return res;
        }

        function openModal() {
            document.getElementById('projectForm').reset();
            document.getElementById('inputId').value = '';
            document.getElementById('inputResiCode').value = generateResi();
            document.getElementById('modalForm').classList.remove('hidden');
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function saveData(e) {
            e.preventDefault();
            const id = document.getElementById('inputId').value;
            const payload = {
                resiCode: document.getElementById('inputResiCode').value,
                klien: document.getElementById('inputKlien').value,
                pekerjaan: document.getElementById('inputPekerjaan').value,
                tglDeadline: document.getElementById('inputTglDeadline').value,
                status: document.getElementById('inputStatus').value,
                detailProgress: document.getElementById('inputDetailProgress').value,
                pdfLink: document.getElementById('inputPdfLink').value
            };

            if(id) refProject.child(id).update(payload).then(() => closeModal('modalForm'));
            else refProject.push(payload).then(() => closeModal('modalForm'));
        }

        function editData(id) {
            const data = globalData.find(p => p.id === id);
            document.getElementById('inputId').value = data.id;
            document.getElementById('inputResiCode').value = data.resiCode;
            document.getElementById('inputKlien').value = data.klien;
            document.getElementById('inputTglDeadline').value = data.tglDeadline;
            document.getElementById('inputPekerjaan').value = data.pekerjaan;
            document.getElementById('inputStatus').value = data.status;
            document.getElementById('inputDetailProgress').value = data.detailProgress || '';
            document.getElementById('inputPdfLink').value = data.pdfLink || '';
            document.getElementById('modalForm').classList.remove('hidden');
        }
    </script>
</body>
</html>
